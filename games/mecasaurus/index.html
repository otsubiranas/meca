function topFails(){return Object.entries(fails).sort((a,b)=>b[1]-a[1]||(a[0]<b[0]?-1:1)).slice(0,5)}
function toMenu(){mode='menu';lvl=0;happy=0;ds=[];lost=false;hurt=0;fin=0;sel=0}
function act(d,p){if(sel==0){if(p)start(0)}else if(sel==1){dif=(dif+d+3)%3;sv()}else if(p)mode='chars'}
function cact(d,p){const i=csel,m=(v,n)=>(v+d+n)%n;
  if(i==0)pc.hat=m(pc.hat,HAT.length);else if(i==1)pc.hair=m(pc.hair,HAIR.length);else if(i==2)pc.hc=m(pc.hc,HC.length);else if(i==3)pc.sk=m(pc.sk,SK.length);else if(i==4)pc.sh=m(pc.sh,SH.length);else if(i==5)pc.skel^=1;else if(p)mode='menu';
  sv()}
function doom(){mode='doom';lost=true;dm=0;fin=0}
function upd(dt){
  T+=dt;shake=Math.max(0,shake-dt);happy=Math.max(0,happy-dt);
  ds.forEach(d=>{
    const dsh=d.dash>0;d.dash=Math.max(0,d.dash-dt); // error: petita embranzida endavant, sense canviar la velocitat base
    d.ph+=dt*(dsh?3:1);
    if(d.st=='walk'){d.x-=(d.v*(d.s.sp||1)+(dsh?70:0))*dt;if(d.s.fly)d.alt=70+100*Math.max(0,Math.min(1,(d.x-112)/(W-112)))+8*Math.sin(d.ph*3);if(d.x-d.s.hs*d.s.u<=112){d.st='miss';d.t0=T;hurt=1;lives--;resolved++;spawn()}}
    else if(d.st=='thanks'&&T-d.t0>1.6)d.st='leave';
    else if(d.st=='miss'&&T-d.t0>1.4)d.st='leave';
    else if(d.st=='leave'){d.x+=75*dt;if(d.s.fly)d.alt+=90*dt}
  });
  ds=ds.filter(d=>d.st!='leave'||d.x-(d.s.bl+d.s.tl)*d.s.u<W);
  if(!fin&&(resolved>=N||lives<=0))fin=T+(lives<=0?1.2:2);
  if(fin&&T>fin){if(lives<=0)doom();else if(lvl==LVL.length-1)finale();else over()}
}

const IX=220;
function crater(){x.fillStyle='#1a0f12';for(let i=0;i<6;i++){const w=70-i*10;x.fillRect(IX-w,G+i*6,w*2,6)}x.fillStyle='#ff6a3a';x.fillRect(IX-76,G-4,152,4)}
function flames(a){
  for(let k=0;k<30;k++){const h=(6+Math.abs(Math.sin(T*9+k*1.7))*20)*a;x.fillStyle=k%2?'#ff7a2e':'#ffd34a';x.fillRect(IX-210+k*14,G-h,10,h)}
  x.fillStyle='#2a1c26';for(let k=0;k<8;k++){const sw=14+k*3;x.fillRect(IX-sw/2+Math.sin(T*2+k)*8,G-40-k*22,sw,18)}
}
function meteor(){
  const p=dm/2.4,mx=W+60-p*(W+60-IX),my=-60+p*(G+60);
  for(let k=14;k>=1;k--){x.fillStyle=['#ff9a2e','#ffd34a','#ff5a1e'][k%3];const z=Math.max(6,40-k*2.5);x.fillRect(mx+.8*k*16-z/2,my-.6*k*16-z/2,z,z)}
  for(let dy=-6;dy<=6;dy++){const w=Math.floor(Math.sqrt(42.5-dy*dy));x.fillStyle='#ff7a2e';x.fillRect(mx-w*4,my+dy*4,w*8,4)}
  for(let dy=-5;dy<=5;dy++){const w=Math.floor(Math.sqrt(30.5-dy*dy));x.fillStyle='#6b4a3a';x.fillRect(mx-w*4,my+dy*4,w*8,4)}
  x.fillStyle='#3d2a22';x.fillRect(mx-8,my-4,8,8);x.fillRect(mx+8,my+8,8,4);
}
function boom(){
  const tt=dm-2.4,a=Math.max(0,.85-tt*.3),r=tt*420;
  for(let dy=0;dy<=Math.min(r,300);dy+=8){const w=Math.sqrt(r*r-dy*dy);x.fillStyle='rgba(255,'+Math.round(170-Math.min(120,dy*.5))+',40,'+a+')';x.fillRect(IX-w,G-dy,w*2,8)}
  for(let i=0;i<24;i++){const ang=-Math.PI*(.08+.84*i/23),sp=160+(i*53%140);x.fillStyle=i%2?'#ff9a2e':'#6b4a3a';x.fillRect(IX+Math.cos(ang)*sp*tt,G+Math.sin(ang)*sp*tt+260*tt*tt,10,10)}
  x.fillStyle='rgba(255,255,255,'+Math.max(0,1-tt*1.6)+')';x.fillRect(-20,-20,W+40,H+40);
}

function draw(){
  const quake=mode=='doom'&&dm>2.4&&dm<3.3, gone=lost&&(mode=='over'||(mode=='doom'&&dm>2.4));
  x.save();const qm=quake?14:hurt>.7?7:0;if(qm)x.translate((Math.random()-.5)*qm,(Math.random()-.5)*qm);
  bg(T);
  if(lost){x.fillStyle='rgba(255,50,0,'+(mode=='over'?.45:Math.min(.45,dm*.2))+')';x.fillRect(0,0,W,H)}
  if(mode=='menu'){
    const k=Math.floor(T/11)%D.length,s=D[k];x.save();x.translate(W+s.hs*s.u+10-(T%11)*95,G-(s.fly?120:0));dino(s,T);x.restore();
  }else if(!gone)ds.forEach(d=>{
    const hop=d.st=='thanks'&&!d.s.fly?-Math.abs(Math.sin((T-d.t0)*9))*12:0;
    if(d.dash>0&&!d.s.fly){x.fillStyle='rgba(217,201,160,.8)';for(let k=0;k<3;k++)x.fillRect(Math.round(d.x+(d.s.bl*.6+k*3)*d.s.u),G-6-(k%2)*8,6+k*2,6)}
    const bt=d.st=='miss'?T-d.t0:9,lg=bt<1?-Math.abs(Math.sin(bt*10))*14:0,ch=bt<.9?Math.floor(bt*9)%2:undefined;
    x.save();x.translate(d.x+lg,G+hop-(d.alt||0));if(d.st=='leave')x.scale(-1,1);dino(d.s,d.ph,ch);x.restore();
  });
  if(!gone&&mode!='chars'){hero(T);fg();bitefx()}
  if(mode=='doom'){if(dm<2.4)meteor();else{crater();flames(Math.min(1,(dm-2.4)*2));boom()}}
  if(mode=='over'&&lost){crater();flames(1)}
  x.restore();
  drawKb();
  if(hurt>.7&&mode!='over'&&mode!='menu'){x.fillStyle='rgba(255,0,0,'+((hurt-.7)*1.1).toFixed(2)+')';x.fillRect(0,0,W,H)}
  const blink=Math.floor(T*2)%2;
  if(mode=='play'||mode=='doom'){
    const d=mode=='play'&&ds.find(d=>d.st=='walk');
    if(d){
      const n=d.s.n;x.font='20px '+F;const cw=x.measureText('W').width,bw=n.length*cw+32,sx=shake>0?Math.random()*6-3:0;
      bubble(16+sx,84,bw,56,heroX+4,HTY(),shake>0?'#ffd0d0':'#fff');
      x.textAlign='left';
      for(let i=0;i<n.length;i++){
        const cx=32+sx+i*cw;
        if(i==idx){x.fillStyle='#f5b800';x.fillRect(cx,124,cw-2,4)}
        x.fillStyle=i<idx?'#17a34a':i==idx?'#000':'#6b6b6b';x.fillText(n[i],cx,118);
      }
    }
    if(!gone)ds.forEach(d=>{
      if(d.st!='thanks'&&d.st!='miss')return;if(d.st=='miss'&&T-d.t0<.9)return;
      const s=d.s,t=d.st=='thanks'?'Gràcies!':'Qui sóc?',tx=d.x-s.hs*s.u+8,ty=G-(s.fly?5*s.u+d.alt:(s.ll+s.bh+s.nk)*s.u)-8;
      x.font='14px '+F;const bw=x.measureText(t).width+24,bx=Math.max(8,Math.min(tx-20,W-bw-12)),by=ty-36-40;
      bubble(bx,by,bw,36,tx,ty,d.st=='thanks'?'#d8ffd0':'#fff');
      x.fillStyle='#000';x.textAlign='left';x.fillText(t,bx+12,by+24);
    });
    txt('PUNTS '+score,12,26,12,'#fff','left');
    gauge();
    txt('DINOS '+Math.min(resolved,N)+'/'+N,12,46,10,'#ffe28a','left');
    for(let i=0;i<3;i++)heart(272+i*30,12,i<lives);
    txt('NIVELL '+(lvl+1)+' · '+DN[dif].toUpperCase(),W/2,52,8,'#fff');
  }else if(mode=='menu')drawMenu();else if(mode=='chars')drawChars();else if(mode=='finale')drawFinale();else{
    drawOver(blink);
    
  }
}

addEventListener('keydown',e=>{
  const k=e.key;
  if(mode=='menu'){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(k)){e.preventDefault();if(k=='ArrowUp')sel=(sel+2)%3;else if(k=='ArrowDown')sel=(sel+1)%3;else if(k=='ArrowLeft')act(-1,0);else if(k=='ArrowRight')act(1,0);else act(1,1)}return}
  if(mode=='chars'){if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' ','Escape'].includes(k)){e.preventDefault();if(k=='Escape')mode='menu';else if(k=='ArrowUp')csel=(csel+6)%7;else if(k=='ArrowDown')csel=(csel+1)%7;else cact(k=='ArrowLeft'?-1:1,k=='Enter'||k==' ')}return}
  if(mode=='over'){if(T-endAt>1){if(k=='Enter'||k==' '){e.preventDefault();enter()}else if(k=='Escape')toMenu()}return}
  if(mode=='finale'){if(T-endAt>2&&(k=='Enter'||k==' '||k=='Escape')){e.preventDefault();toMenu()}return}
  if(mode=='doom')return;
  if(k=='Escape'){toMenu();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.key.length!=1)return;
  e.preventDefault();
  const d=ds.find(d=>d.st=='walk');if(!d)return;
  const n=d.s.n;
  pressK=e.key.toLowerCase();pressT=T;
  if(pressK==n[idx]){pressOk=1;lok++;idx++;ok++;score+=10;if(idx==n.length)done(d)}
  else{pressOk=0;lerr++;fails[n[idx]]=(fails[n[idx]]||0)+1;err++;d.e++;d.dash=.25;shake=.3}
});
c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width,py=(e.clientY-r.top)*CH/r.height;
  if(mode=='menu'){const i=Math.floor((py-140)/40);if(py>=140&&i<3&&px>150&&px<570){sel=i;act(px<360?-1:1,1)}}
  else if(mode=='finale'){if(T-endAt>2)toMenu()}
  else if(mode=='chars'){const i=Math.floor((py-64)/36);if(i>=0&&i<7&&px>44&&px<464){csel=i;cact(px<254?-1:1,1)}}
  else if(mode=='over'&&T-endAt>1)enter()});

function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  hurt=Math.max(0,hurt-dt);scr+=dt*(mode=='play'?30:mode=='menu'?12:0);
  if(mode=='play')upd(dt);else{T+=dt;if(mode=='doom'){dm+=dt;if(dm>5.6)over()}}
  draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script></body></html>
