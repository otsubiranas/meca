<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invasors de tecles · Jocs de mecanografia</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap');

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"DM Sans",sans-serif}
body{background:#09101d;color:#fff;overflow-x:hidden}
button{font:inherit}
a{text-decoration:none;color:inherit}

.game-page{min-height:100vh;display:flex;flex-direction:column}
.topbar{width:min(1180px,92%);margin:0 auto;padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}
.back{color:rgba(255,255,255,.72);font-size:.9rem;font-weight:700;transition:.2s}
.back:hover{color:#84cbc9;transform:translateX(-3px)}
.logo-title{font-family:"Space Grotesk";font-weight:700;letter-spacing:-.04em}
.logo-title span{color:#84cbc9}

.hud{width:min(1180px,92%);margin:0 auto 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px}
.hud-box{background:#101927;border:1px solid rgba(132,203,201,.18);border-radius:14px;padding:12px 18px}
.hud-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.48);display:block}
.hud-value{font-family:"Space Grotesk";font-size:1.25rem;font-weight:700}
.hud-center{text-align:center}
.level{font-family:"Space Grotesk";font-size:1.8rem;font-weight:700}
.level span{color:#84cbc9}
.progress-wrap{width:190px;height:6px;background:#202a38;border-radius:99px;overflow:hidden;margin-top:5px}
.progress{height:100%;width:0;background:#84cbc9;transition:width .2s}

.game-area{width:min(1180px,92%);margin:0 auto;flex:1;display:flex;flex-direction:column}
.arena{position:relative;min-height:620px;flex:1;background:radial-gradient(circle at 50% 15%,rgba(132,203,201,.07),transparent 35%),#0d1624;border:1px solid rgba(132,203,201,.18);border-radius:24px;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:
radial-gradient(circle,rgba(255,255,255,.55) 1px,transparent 1px),
radial-gradient(circle,rgba(132,203,201,.35) 1px,transparent 1px);
background-size:91px 91px,137px 137px;background-position:15px 23px,64px 7px}

.invaders{position:absolute;left:50%;top:72px;transform:translateX(-50%);width:min(900px,90%);display:grid;grid-template-columns:repeat(10,1fr);gap:13px 12px;transition:top .18s linear}
.key{aspect-ratio:1.15/1;border:1px solid rgba(132,203,201,.28);border-radius:11px;background:#142131;color:#fff;display:grid;place-items:center;font-family:"Space Grotesk";font-size:clamp(1rem,2.2vw,1.5rem);font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s,background .12s,border-color .12s,opacity .2s}
.key.target{background:#84cbc9;color:#09101d;border-color:#b7f1ef;box-shadow:0 0 25px rgba(132,203,201,.45),inset 0 -3px 0 rgba(0,0,0,.12);transform:scale(1.08);animation:pulse .75s infinite alternate}
.key.hit{animation:explode .28s forwards;pointer-events:none}
.key.extra{border-color:rgba(255,255,255,.25);background:#182334}
@keyframes pulse{to{box-shadow:0 0 38px rgba(132,203,201,.75),inset 0 -3px 0 rgba(0,0,0,.12)}}
@keyframes explode{0%{transform:scale(1);opacity:1}100%{transform:scale(1.65);opacity:0}}

.ship{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:3.1rem;filter:drop-shadow(0 0 13px rgba(132,203,201,.35));transition:.15s}
.laser{position:absolute;width:4px;height:34px;background:#84cbc9;border-radius:5px;bottom:82px;opacity:0;left:50%;transform:translateX(-50%)}
.laser.fire{animation:laser .22s linear}
@keyframes laser{0%{bottom:82px;opacity:1}100%{bottom:calc(100% - 130px);opacity:0}}

.message{position:absolute;inset:0;display:grid;place-items:center;background:rgba(9,16,29,.76);backdrop-filter:blur(5px);z-index:5;padding:25px}
.panel{text-align:center;max-width:620px}
.panel .big{font-size:4rem;margin-bottom:8px}
.panel h1{font-family:"Space Grotesk";font-size:clamp(2.3rem,6vw,4.6rem);line-height:1;margin:0 0 15px;letter-spacing:-.055em}
.panel h1 span{color:#84cbc9}
.panel p{color:rgba(255,255,255,.7);font-size:1.05rem;line-height:1.6;margin:0 auto 25px;max-width:520px}
.primary{border:0;background:#84cbc9;color:#09101d;border-radius:10px;padding:14px 24px;font-weight:700;cursor:pointer;transition:.2s}
.primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(132,203,201,.2)}
.hidden{display:none!important}

.bottom-info{padding:17px 0 24px;display:flex;justify-content:space-between;gap:15px;color:rgba(255,255,255,.48);font-size:.8rem}
.target-hint strong{color:#84cbc9;font-family:"Space Grotesk";font-size:1rem}

.shake{animation:shake .2s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

@media(max-width:700px){
  .topbar{padding:16px 0}.hud{grid-template-columns:1fr 1fr}.hud-center{grid-column:1/-1;grid-row:1}.hud-box{padding:9px 13px}.arena{min-height:570px;border-radius:18px}.invaders{top:70px;grid-template-columns:repeat(7,1fr);gap:9px}.key{border-radius:8px}.bottom-info{flex-direction:column}.progress-wrap{width:150px;margin-inline:auto}
}
/* Alineació visual de les files com un teclat real. */



.keyboard-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  width:100%;
}
.keyboard-row .key{
  flex:0 0 9%;
}
.keyboard-row.row-0 .key{
  flex-basis:9%;
}
.keyboard-row.row-1{
  padding-left:4%;
}
.keyboard-row.row-1 .key{
  flex-basis:9%;
}
.keyboard-row.row-2{
  width:70%;
}
.keyboard-row.row-2 .key{
  flex-basis:14%;
}
.punctuation-row{
  width:auto;
}
.punctuation-row .key{
  flex:0 0 90px;
}
.key.uppercase{
  text-transform:uppercase;
}

</style>
</head>
<body>
<div class="game-page">
  <header class="topbar">
    <a class="back" href="../../index.html">← Tornar als jocs</a>
    <div class="logo-title">INVASORS <span>DE TECLES</span></div>
  </header>

  <section class="hud">
    <div class="hud-box">
      <span class="hud-label">Puntuació</span>
      <span class="hud-value" id="score">0</span>
    </div>
    <div class="hud-center">
      <div class="level">Nivell <span id="level">1</span></div>
      <div class="progress-wrap"><div class="progress" id="progress"></div></div>
    </div>
    <div class="hud-box" style="text-align:right">
      <span class="hud-label">Encerts</span>
      <span class="hud-value"><span id="hits">0</span>/<span id="total">0</span></span>
    </div>
  </section>

  <main class="game-area">
    <div class="arena" id="arena">
      <div class="stars"></div>
      <div class="invaders" id="invaders"></div>
      <div class="laser" id="laser"></div>
      <div class="ship">🚀</div>

      <div class="message" id="message">
        <div class="panel">
          <div class="big">👾</div>
          <h1>Invasors <span>de tecles</span></h1>
          <p>Prem la tecla que s'il·lumina abans que desaparegui. Elimina totes les tecles per superar cada nivell.</p>
          <button class="primary" id="startBtn">Començar</button>
        </div>
      </div>
    </div>

    <div class="bottom-info">
      <div class="target-hint">Tecla objectiu: <strong id="targetHint">—</strong></div>
      <div>Nivell 1: QWERTY · Nivell 2: 2 accents + 2 signes · Nivell 5+: 3 majúscules</div>
    </div>
  </main>
</div>

<input id="keyboardInput" aria-label="Entrada de teclat" autocomplete="off" autocapitalize="off" spellcheck="false"
       style="position:fixed;left:-10000px;top:-10000px;width:1px;height:1px;opacity:0">

<script>
(() => {
  const levelEl = document.getElementById('level');
  const scoreEl = document.getElementById('score');
  const hitsEl = document.getElementById('hits');
  const totalEl = document.getElementById('total');
  const progressEl = document.getElementById('progress');
  const invadersEl = document.getElementById('invaders');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('startBtn');
  const input = document.getElementById('keyboardInput');
  const targetHint = document.getElementById('targetHint');
  const arena = document.getElementById('arena');
  const laser = document.getElementById('laser');

  // Disposició fixa de teclat QWERTY.
  const rows = [
    [...'qwertyuiop'],
    [...'asdfghjkl'],
    [...'zxcvbnm']
  ];

  // A nivell 2 algunes vocals poden convertir-se en accentuades i
  // apareixen signes de puntuació habituals.
  const accented = {
    a: ['à','á'],
    e: ['é','è'],
    i: ['í','ï'],
    o: ['ò','ó'],
    u: ['ú','ü']
  };
  const punctuation = ['.', ',', '?', '!', ':', ';'];
  const letters = rows.flat();

  let level = 1, score = 0, hits = 0, total = 0;
  let targets = [], currentTarget = null, running = false;
  let speedTimer = null;
  let invaderOffset = 0;

  function movementDelay() {
    // Nivells 1-2: molt lent. Des del 3 accelera progressivament.
    if (level === 1) return 1150;
    if (level === 2) return 1000;
    return Math.max(230, 850 - (level - 3) * 70);
  }

  function shuffled(arr) {
    const a = [...arr];
    for (let i=a.length-1;i>0;i--) {
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function setMessage(icon, title, text, buttonText) {
    messageEl.querySelector('.big').textContent = icon;
    messageEl.querySelector('h1').innerHTML = title;
    messageEl.querySelector('p').textContent = text;
    startBtn.textContent = buttonText;
    messageEl.classList.remove('hidden');
  }

  function buildLevel() {
    clearTimeout(speedTimer);
    running = true;
    currentTarget = null;
    invaderOffset = 0;

    invadersEl.style.top = '72px';
    invadersEl.style.left = '50%';
    invadersEl.style.transform = 'translateX(-50%)';
    invadersEl.innerHTML = '';

    // Teclat QWERTY real: 10 + 9 + 7 tecles.
    const visualRows = rows.map(row => row.map(char => ({
      char,
      display: char,
      extra: false,
      uppercase: false
    })));

    // Exactament 2 accents a partir del nivell 2.
    if (level >= 2) {
      const vowels = ['a','e','i','o','u'];
      const candidates = [];
      visualRows.forEach((row, r) => row.forEach((key, c) => {
        if (vowels.includes(key.char)) candidates.push([r, c]);
      }));

      shuffled(candidates).slice(0, 2).forEach(([r, c]) => {
        const base = visualRows[r][c].char;
        const options = accented[base];
        visualRows[r][c].display =
          options[Math.floor(Math.random() * options.length)];
      });
    }

    // A partir del nivell 5, exactament 3 majúscules aleatòries.
    if (level >= 5) {
      const candidates = [];
      visualRows.forEach((row, r) => row.forEach((key, c) => {
        candidates.push([r, c]);
      }));

      shuffled(candidates).slice(0, 3).forEach(([r, c]) => {
        visualRows[r][c].display = visualRows[r][c].display.toUpperCase();
        visualRows[r][c].uppercase = true;
      });
    }

    const flatVisual = visualRows.flat();
    targets = flatVisual.map(k => k.display);

    // Exactament 2 signes de puntuació, canviants a cada nivell.
    const punctuationKeys = level >= 2
      ? shuffled(punctuation).slice(0, 2)
      : [];

    punctuationKeys.forEach(char => {
      flatVisual.push({char, display: char, extra: true, uppercase: false});
      targets.push(char);
    });

    total = targets.length;
    hits = 0;
    totalEl.textContent = total;
    hitsEl.textContent = hits;
    levelEl.textContent = level;
    progressEl.style.width = '0%';

    let index = 0;

    // Tres files amb aspecte de teclat.
    visualRows.forEach((row, rowIndex) => {
      const rowEl = document.createElement('div');
      rowEl.className = 'keyboard-row row-' + rowIndex;

      row.forEach(key => {
        const el = document.createElement('div');
        el.className = 'key' + (key.uppercase ? ' uppercase' : '');
        el.dataset.char = key.display;
        el.textContent = key.display;
        el.dataset.index = index++;
        rowEl.appendChild(el);
      });

      invadersEl.appendChild(rowEl);
    });

    // La puntuació va en una fila pròpia.
    if (punctuationKeys.length) {
      const punctuationRow = document.createElement('div');
      punctuationRow.className = 'keyboard-row punctuation-row';

      punctuationKeys.forEach(char => {
        const el = document.createElement('div');
        el.className = 'key extra';
        el.dataset.char = char;
        el.textContent = char;
        el.dataset.index = index++;
        punctuationRow.appendChild(el);
      });

      invadersEl.appendChild(punctuationRow);
    }

    invadersEl.style.display = 'flex';
    invadersEl.style.flexDirection = 'column';
    invadersEl.style.alignItems = 'center';
    invadersEl.style.gap = '10px';
    invadersEl.style.width = 'min(900px, 90%)';

    nextTarget();
    startSpaceInvadersMovement();
    focusInput();
  }


  function nextTarget() {
    const available = [...invadersEl.querySelectorAll('.key:not(.hit)')];
    if (!available.length) {
      finishLevel();
      return;
    }

    if (currentTarget) currentTarget.classList.remove('target');
    currentTarget = available[Math.floor(Math.random() * available.length)];
    currentTarget.classList.add('target');
    targetHint.textContent = currentTarget.dataset.char;
  }

  function startSpaceInvadersMovement() {
    clearTimeout(speedTimer);

    // Moviment horitzontal com Space Invaders:
    // avança, toca el límit, baixa una mica i canvia de direcció.
    let direction = 1;
    let horizontal = 0;
    let descending = false;

    const tick = () => {
      if (!running) return;

      const arenaWidth = arena.clientWidth;
      const formationWidth = invadersEl.offsetWidth;
      const maxHorizontal = Math.max(15, (arenaWidth - formationWidth) / 2 - 10);

      horizontal += direction * (level >= 3 ? 8 + (level - 3) * 1.5 : 4);

      if (horizontal >= maxHorizontal || horizontal <= -maxHorizontal) {
        direction *= -1;
        invaderOffset += level >= 3 ? 10 + (level - 3) * 1.5 : 5;
      }

      const bottomLimit = arena.clientHeight - 175;
      if (72 + invaderOffset >= bottomLimit) {
        gameOver();
        return;
      }

      invadersEl.style.transform =
        `translateX(calc(-50% + ${horizontal}px))`;
      invadersEl.style.top = `${72 + invaderOffset}px`;

      speedTimer = setTimeout(tick, movementDelay());
    };

    speedTimer = setTimeout(tick, movementDelay());
  }

  function fireLaser() {
    laser.classList.remove('fire');
    void laser.offsetWidth;
    laser.classList.add('fire');
  }

  function beep(freq=520, duration=.07, type='sine') {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      gain.gain.setValueAtTime(.045, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function hit(char) {
    if (!running || !currentTarget) return;
    if (char.toLowerCase() !== currentTarget.dataset.char.toLowerCase()) {
      arena.classList.remove('shake'); void arena.offsetWidth; arena.classList.add('shake');
      beep(130,.08,'square');
      return;
    }

    const hitEl = currentTarget;
    hitEl.classList.remove('target');
    hitEl.classList.add('hit');
    score += level >= 3 ? level * 15 : level * 10;
    hits++;
    scoreEl.textContent = score;
    hitsEl.textContent = hits;
    progressEl.style.width = `${(hits / total) * 100}%`;
    fireLaser();
    beep(650 + level * 35,.08,'triangle');

    currentTarget = null;
    setTimeout(() => {
      if (running) nextTarget();
    }, 110);
  }

  function finishLevel() {
    running = false;
    clearTimeout(speedTimer);
    if (level >= 2) score += 100 * level;
    scoreEl.textContent = score;

    if (level === 1) {
      level = 2;
      setMessage('🚀','Nivell <span>1 superat!</span>','Ara arriben accents i signes de puntuació. Prepara els dits!','Nivell 2');
    } else {
      level++;
      setMessage('🔥',`Nivell <span>${level - 1} superat!</span>`,`Molt bé! Ara les tecles apareixeran més ràpid.`, `Nivell ${level}`);
    }
    beep(880,.12,'triangle');
  }

  function gameOver() {
    running = false;
    clearTimeout(speedTimer);
    setMessage('💥','Fi de la <span>partida</span>',`Has arribat al nivell ${level} amb ${score} punts. Torna-ho a provar i supera la teva puntuació!`,'Tornar a jugar');
    beep(100,.18,'sawtooth');
  }

  function startGame() {
    level = 1; score = 0; hits = 0; total = 0;
    scoreEl.textContent = '0';
    messageEl.classList.add('hidden');
    buildLevel();
  }

  function continueGame() {
    messageEl.classList.add('hidden');
    buildLevel();
  }

  function focusInput() {
    setTimeout(() => input.focus(), 20);
  }

  input.addEventListener('input', () => {
    const value = input.value;
    if (value) {
      // L'input event és especialment útil per a accents creats amb tecles mortes.
      const chars = [...value];
      const char = chars[chars.length - 1];
      input.value = '';
      hit(char);
    }
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Backspace') input.value = '';
  });

  document.addEventListener('keydown', e => {
    if (!messageEl.classList.contains('hidden')) return;
    focusInput();
  });

  arena.addEventListener('click', focusInput);
  startBtn.addEventListener('click', () => {
    if (level === 1 && !running) {
      // Si és la pantalla inicial o fi de partida, comencem de zero.
      if (score === 0 && total === 0) startGame();
      else continueGame();
    } else if (!running) {
      continueGame();
    }
    focusInput();
  });

  focusInput();
})();
</script>
</body>
</html>
