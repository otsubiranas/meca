<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pingui · Jocs de mecanografia</title>
<link rel="icon" href="img/pingui.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#1d3a66 0%,#0b1529 70%);color:#e8f6ff;font-family:'Press Start 2P',monospace;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px;overflow:hidden}
#wrap{position:relative;width:min(96vw,calc((100vh - 130px)*16/9));aspect-ratio:16/9;border:4px solid #0a1224;border-radius:6px;
  box-shadow:0 0 0 4px #5aa9e6,0 14px 40px rgba(0,0,0,.6);background:#000;overflow:hidden}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.btn{position:absolute;font-family:inherit;font-size:clamp(7px,1vw,11px);padding:8px 10px;cursor:pointer;color:#fff}
#menuBtn{left:12px;bottom:12px;background:#d8433a;border:3px solid #3a0d10;box-shadow:0 3px 0 #3a0d10;display:none}
#menuBtn:hover{background:#ef5a50}
#soundBtn{right:10px;bottom:10px;background:rgba(20,45,80,.75);border:3px solid #0a1a33;box-shadow:0 3px 0 #0a1a33}
#kb{display:flex;gap:clamp(4px,.6vw,8px);user-select:none}
.key{width:clamp(34px,4.6vw,58px);height:clamp(36px,4.8vw,60px);border-radius:7px;background:linear-gradient(#f4f8fc,#c9d6e3);
  border:2px solid #22344f;box-shadow:0 5px 0 #22344f;color:#1b2b45;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:clamp(11px,1.4vw,17px);transition:transform .05s,box-shadow .05s}
.key small.arw{font-family:Arial,sans-serif;font-size:clamp(11px,1.3vw,16px);line-height:.6;opacity:.9}
.key small{font-size:clamp(5px,.55vw,7px);letter-spacing:0;opacity:.85}
.key.ctrl{background:linear-gradient(#ffe39a,#f2b84b);border-color:#5a3a06;box-shadow:0 5px 0 #5a3a06;color:#3d2600}
.key.fish{background:linear-gradient(#c9f5f2,#79d6d0);border-color:#0f4f5a;box-shadow:0 5px 0 #0f4f5a;color:#0b3a42}
.key.on{transform:translateY(4px);box-shadow:0 1px 0 #22344f;filter:brightness(1.12)}
.key.target{animation:pulse .5s infinite alternate}
@keyframes pulse{from{outline:3px solid #fff;outline-offset:2px}to{outline:3px solid #44e0ff;outline-offset:5px}}
#hint{font-size:clamp(6px,.7vw,9px);color:#9cc4e8;text-align:center;line-height:1.7}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <button class="btn" id="menuBtn">◄ MENÚ</button>
  <button class="btn" id="soundBtn">SO: SÍ</button>
</div>
<div id="kb"></div>
<div id="hint">Dits a la filera central · ESC pausa</div>

<script>
'use strict';
// ====================== CONSTANTS ======================
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=960,H=540,T=32,ROWS=17;
const G=1900, JUMP=730, MAXV=235, WATER_Y=468;
const FISH_LETTERS=['a','d','g','h','k','l','ñ'];
const FISH_COLORS={a:'#ff8a5c',d:'#ffd34d',g:'#7ee07a',h:'#5cc8ff',k:'#c58cff',l:'#ff6fa8','ñ':'#ffb347'};
const LEVEL_INFO=[
  {name:'LES GLACERES',bg:'fons1',hint:["Salta els forats d'aigua","i trepitja els crancs!"],target:70,snow:true},
  {name:"EL MAR D'ICEBERGS",bg:'fons2',hint:['Noves amenaces: les foques (2 salts)','i els carambanys que cauen. Corre!'],target:85,snow:true},
  {name:'POSTA DE SOL POLAR',bg:'fons3',hint:['Boles de neu rodolant!','Salta-les o trenca-les trepitjant-les.'],target:100,snow:false},
  {name:'ELS ICEBERGS GEGANTS',bg:'fons4',target:110,snow:true},
  {name:"L'AURORA BOREAL",bg:'fons2',target:125,snow:true,fx:'night'},
  {name:'LA TEMPESTA DE NEU',bg:'fons1',target:150,snow:true,fx:'storm'},
  {name:'LA COVA DE GEL',bg:'fons5',target:120,snow:false,cave:true},
  {name:'LA COVA FOSCA',bg:'fons6',target:140,snow:false,cave:true},
];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ease=t=>1-Math.pow(1-t,3);

// ====================== IMAGES ======================
const IMG={};
function loadImg(n,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[n]=i;r()};i.onerror=()=>r();i.src=src;});}

function spr(rows,pal,s=2){
  const h=rows.length,w=Math.max(...rows.map(r=>[...r].length));
  const c=document.createElement('canvas');c.width=w*s;c.height=h*s;const g=c.getContext('2d');
  rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(pal[ch]){g.fillStyle=pal[ch];g.fillRect(x*s,y*s,s,s);}}));
  return c;
}
function flip(c){const f=document.createElement('canvas');f.width=c.width;f.height=c.height;const g=f.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return f;}

const FISH_ROWS=[
"....BBB.....",
"..BBLLLB..B.",
".BLWKLLLB.BB",
"BLLLLLLLLBBB",
".BLLLLLLB.BB",
"..BBLLLB..B.",
"....BBB....."];
const HEART=[
".RR...RR.",
"RWRR.RRRR",
"RWRRRRRRR",
"RRRRRRRRR",
".RRRRRRR.",
"..RRRRR..",
"...RRR...",
"....R...."];
const SPR={};
function tint(im,col){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');
  g.drawImage(im,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=col;g.fillRect(0,0,c.width,c.height);return c;}
function buildSprites(){
  if(IMG.peix)SPR.peixBuit=tint(IMG.peix,'rgba(30,45,80,.85)');
  if(IMG.foca)SPR.focaHurt=tint(IMG.foca,'rgba(255,70,70,.45)');
  SPR.heart=spr(HEART,{R:'#e8384f',W:'#ffd0d6'},3);
  SPR.heartEmpty=spr(HEART,{R:'#2a3550',W:'#3a4870'},3);
  SPR.fish={};
  for(const l of FISH_LETTERS){const c=FISH_COLORS[l];SPR.fish[l]=spr(FISH_ROWS,{B:shade(c,-0.45),L:c,W:'#fff',K:'#111'},3);}
  SPR.fishHud=spr(FISH_ROWS,{B:'#1d5a7a',L:'#5cc8ff',W:'#fff',K:'#111'},3);
  buildTiles();
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const m=f<0?0:255,a=Math.abs(f);r=Math.round(r+(m-r)*a);g=Math.round(g+(m-g)*a);b=Math.round(b+(m-b)*a);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

// ====================== TILES ======================
const TILE={};
function mkTile(fn){const c=document.createElement('canvas');c.width=c.height=T;const g=c.getContext('2d');
  const p=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x*2,y*2,w*2,h*2)};fn(p);return c;}
function bricks(p,start,pal=['#2f4a78','#1b2b4a','#4a6da3','#26406a']){
  p(0,start,16,16-start,pal[0]);
  let i=0;
  for(let r=start;r<16;r+=4,i++){
    const off=i%2?4:0;
    p(0,r,16,1,pal[1]);
    for(let x=off-8;x<16;x+=8){p(x,r,1,4,pal[1]);p(x+1,r+1,5,1,pal[2]);p(x+1,r+2,1,1,pal[2]);p(x+2,r+3,5,1,pal[3]);}
  }
}
function snowCap(p){
  p(0,0,16,4,'#f4fbff');p(0,0,16,1,'#ffffff');p(0,3,16,1,'#e1f0fa');p(0,4,16,1,'#c7e2f3');
  p(1,5,3,1,'#c7e2f3');p(2,6,1,1,'#c7e2f3');p(8,5,4,1,'#dbeefa');p(9,6,2,1,'#c7e2f3');p(13,5,2,1,'#dbeefa');
  p(3,1,2,1,'#fff');p(11,2,1,1,'#d6ebf7');p(6,2,1,1,'#d6ebf7');
}
function iceBody(p,start){
  p(0,start,16,16-start,'#98d3ee');p(0,15,16,1,'#4a8fbe');p(15,start,1,16-start,'#6ab0d8');p(0,start,1,16-start,'#c4ecfb');
  p(3,start+3,1,4,'#e9fbff');p(4,start+2,1,2,'#e9fbff');p(9,start+7,4,1,'#cfeffb');p(11,start+5,2,1,'#e9fbff');p(6,13,3,1,'#7cc0e2');
}
function buildTiles(){
  TILE.gTop=mkTile(p=>{bricks(p,4);snowCap(p);});
  TILE.gMid=mkTile(p=>{bricks(p,0);});
  const CP=['#4b4878','#26243f','#6d6aa3','#3a3760'];
  TILE.cTop=mkTile(p=>{bricks(p,4,CP);p(0,0,16,4,'#cfe4ff');p(0,0,16,1,'#ffffff');p(0,4,16,1,'#8fb2e0');p(2,5,3,1,'#8fb2e0');p(9,5,4,1,'#a9c6ee');p(10,6,2,1,'#8fb2e0');p(4,1,2,1,'#fff');});
  TILE.cMid=mkTile(p=>{bricks(p,0,CP);});
  TILE.rock=mkTile(p=>{p(0,0,16,16,'#2c2a48');p(1,2,6,4,'#3b3860');p(9,1,6,5,'#35335a');p(3,8,8,5,'#3b3860');p(12,9,4,5,'#322f52');
    p(1,2,6,1,'#4d4a78');p(9,1,6,1,'#46437a');p(3,8,8,1,'#4d4a78');p(0,15,16,1,'#1c1a30');});
  TILE.iTop=mkTile(p=>{iceBody(p,4);snowCap(p);});
  TILE.door=mkTile(p=>{p(0,0,16,16,'#2a6f9e');p(1,1,14,14,'#6fc3e8');p(2,2,12,12,'#a9e2f7');p(3,3,3,1,'#e9fbff');p(3,3,1,4,'#e9fbff');
    p(9,6,1,3,'#6fc3e8');p(10,9,2,1,'#6fc3e8');p(6,11,1,2,'#6fc3e8');});
  TILE.iMid=mkTile(p=>{iceBody(p,0);p(0,0,16,1,'#c4ecfb');});
}

// ====================== LEVEL BUILDER ======================
class LB{
  constructor(R=17){this.R=R;this.cd=0;this.mv=[];this.doors=[];this.cols=[];this.x=0;this.lastTop=R-4;this.walk=[];this.fish=[];this.ices=[];this.sp=[];this.cps=[];this.goalX=0;}
  col(i){while(this.cols.length<=i)this.cols.push(new Uint8Array(this.R));return this.cols[i];}
  ceil(){this.cave=true;return this;}
  st(dx){this.ices.push({c:this.x+dx,row:-1,st:1});return this;}
  g(n,h=4){for(let i=0;i<n;i++){const c=this.col(this.x+i);for(let r=this.R-h;r<this.R;r++)c[r]=1;}this.lastTop=this.R-h;this.x+=n;return this;}
  pit(n){for(let i=0;i<n;i++)this.col(this.x+i);this.x+=n;return this;}
  plat(dx,row,len){for(let i=0;i<len;i++)this.col(this.x+dx+i)[row]=2;return this;}
  crab(dx,row){this.walk.push({k:'crab',c:this.x+dx,row:row??this.lastTop});return this;}
  seal(dx,row){this.walk.push({k:'seal',c:this.x+dx,row:row??this.lastTop});return this;}
  f(dx,row){this.fish.push({c:this.x+dx,row});return this;}
  ice(dx,row){this.ices.push({c:this.x+dx,row});return this;}
  ball(dx){this.sp.push({c:this.x+dx,row:this.lastTop});return this;}
  cp(){return this;} // sense punts de control: es torna a l'inici
  goal(h=4){this.goalX=this.x+8;this.g(13,h);return this;}
  // --- mètodes per alçades (k = alçada de la superfície des del fons)
  p(dx,k,len){return this.plat(dx,this.R-k,len);}
  brk(dx,k,len){const row=this.R-k;for(let i=0;i<len;i++)this.col(this.x+dx+i)[row]=5;(this.brks??=[]).push({c:this.x+dx,len,row});return this;}
  spk(dx){(this.spks??=[]).push({c:this.x+dx,row:this.lastTop});return this;}
  pont(dx,len){(this.ponts??=[]).push({c:this.x+dx,len,row:this.lastTop});return this;}
  pontT(dx,len){(this.ponTs??=[]).push({c:this.x+dx,len,row:this.lastTop});return this;}
  fk(dx,k){return this.f(dx,this.R-k);}
  ick(dx,k){return this.ice(dx,this.R-k);}
  cr(dx,k){return this.crab(dx,k===undefined?undefined:this.R-k);}
  se(dx,k){return this.seal(dx,k===undefined?undefined:this.R-k);}
  bl(dx){return this.ball(dx);}
  dr(dx,hg=5){const c=this.x+dx,r1=this.lastTop-1,r0=this.lastTop-hg;for(let r=r0;r<=r1;r++)this.col(c)[r]=3;this.doors.push({c,r0,r1});return this;}
  mvp(dx,k,len,ax,ay,per){this.mv.push({c:this.x+dx,k,len,ax,ay,per});return this;}
}
function level1(){const L=new LB();
  L.g(14).f(-6,11).f(-3,10);
  L.g(5,5).f(-2,10);
  L.g(5,6).f(-3,9);
  L.g(6,4);
  L.pit(2);
  L.g(7).f(-4,11);
  L.pit(3).f(-2,10).pont(-3,3);
  L.g(8).cp(-4);
  L.g(16).crab(-5).plat(-12,10,3).f(-11,8);
  L.pit(2);
  L.g(6,5).crab(-3);
  L.pit(3);
  L.g(12).crab(-9).crab(-4).f(-6,10);
  L.pit(4).plat(-3,10,2);
  L.g(6).cp(-3);
  L.g(4,5);L.g(4,6);L.g(4,7).f(-2,7);
  L.pit(3);
  L.g(5,6).crab(-3);
  L.g(10,4).plat(-8,10,2).plat(-4,9,2).f(-3,7).crab(-6);
  L.pit(2);L.g(3);L.pit(3);L.g(3).f(-2,10);L.pit(3);
  L.g(10).crab(-6).crab(-3);
  L.goal();return L;}
function level2(){const L=new LB();
  L.g(10).f(-5,11).f(-3,11);
  L.pit(3).pont(-3,3);
  L.g(9).seal(-3);
  L.pit(2);
  L.g(12).plat(-10,9,7).ice(-9,9).ice(-6,9).f(-2,11);
  L.g(4).cp(-2);
  L.pit(5).plat(-4,11,1).plat(-2,10,1).f(-2,8);
  L.g(6,5).crab(-3);
  L.pit(3).f(-2,10);
  L.g(14).seal(-10).seal(-3).plat(-8,10,3).f(-7,8);
  L.pit(2);
  L.g(11).plat(-10,9,8).ice(-9,9).ice(-7,9).ice(-5,9).ice(-3,9);
  L.g(3).cp(-2);
  L.pit(4).plat(-3,11,2).f(-2,9);
  L.g(5,5);L.g(5,6).seal(-3);
  L.pit(3);
  L.g(8,5).crab(-4).f(-6,10);
  L.pit(2);L.g(2,5);L.pit(2);L.g(2,6).f(-1,9);L.pit(2);
  L.g(12).seal(-8).crab(-4).f(-6,10);
  L.g(9).plat(-8,9,6).ice(-7,9).ice(-4,9);
  L.goal();return L;}
function level3(){const L=new LB();
  L.g(12).f(-6,11).f(-4,10);
  L.g(16).ball(-1).f(-8,11).spk(-10);
  L.pit(2);
  L.g(8,5).crab(-4);
  L.pit(3);
  L.g(10).plat(-9,9,6).ice(-8,9).ice(-5,9).f(-2,11);
  L.g(3).cp(-2);
  L.g(18).ball(-1).seal(-8).f(-12,10);
  L.pit(4).f(-2,8);L.brk(-3,7,2);
  L.g(6,5);L.g(6,6).crab(-3);
  L.pit(3);
  L.g(14).ball(-1).seal(-9).f(-6,10);
  L.g(4).cp(-2);
  L.pit(2);L.g(2,5);L.pit(3);L.g(3,6).f(-1,9);L.pit(3);
  L.g(12).plat(-10,9,7).ice(-9,9).ice(-7,9).ice(-5,9).crab(-2);
  L.g(16).ball(-1).seal(-10).crab(-5).f(-7,10);
  L.goal();return L;}
function level4(){const L=new LB(22);
  L.g(10).fk(-5,6).fk(-3,7).spk(-3);
  L.g(8).dr(-4).fk(-1,6);
  L.pit(7).mvp(-6,4,2,3,0,3.2).fk(-3,7).pontT(-7,7);
  L.g(10).cr(-2).p(-8,7,2).brk(-4,10,2).fk(-3,12);
  L.g(8,13).cr(-4,13).fk(-2,15).spk(-2);
  L.pit(4).g(3,9);
  L.pit(3).g(3,12).fk(-2,14);
  L.pit(4).g(7,8).se(-2,8).p(-6,12,4).ick(-5,12).ick(-3,12);
  L.g(3,8).dr(-2);
  L.pit(6).mvp(-5,8,2,3,0,3).fk(-3,10);
  L.g(12).se(-6).p(-10,7,2).p(-5,10,2).p(-10,13,2).fk(-9,15).p(-4,16,2);
  L.goal(16);return L;}
function level5(){const L=new LB(30);
  L.g(9).fk(-4,6).fk(-2,7).spk(-3);
  L.g(6).dr(-2);
  L.pit(5).mvp(-4,4,2,2,0,2.6);
  L.g(14).se(-3).p(-12,7,3).brk(-7,10,2).fk(-6,12).p(-12,13,3).ick(-11,13).p(-6,16,3);
  L.g(7,19).cr(-3,19).fk(-2,21);
  L.pit(3).g(2,17);
  L.pit(3).g(2,20).fk(-1,22);
  L.pit(5).mvp(-4,14,2,0,8,4.5);
  L.g(10,23).dr(-6).se(-2,23);
  L.pit(3).g(3,21);
  L.pit(3).g(3,24).fk(-1,26);
  L.pit(4).g(3,21).cr(-1,21);
  L.pit(3).g(2,24);
  L.goal(24);return L;}
function level6(){const L=new LB(30);
  L.g(10).fk(-5,6);
  L.g(14).bl(-1).p(-11,8,3).fk(-10,10);
  L.pit(3).g(4,7).cr(-2,7);
  L.pit(3).g(5,10).dr(-4);
  L.pit(4).g(3,13).fk(-1,15);
  L.g(16,13).bl(-1).spk(-13).se(-8,13).p(-12,17,3).ick(-11,17).ick(-10,17);
  L.pit(6).mvp(-5,13,2,3,0,3.2).pontT(-6,6);
  L.g(10,13).dr(-6).cr(-3,13);
  L.g(12,13).p(-10,16,2).brk(-5,19,2).p(-10,22,2).fk(-9,24).p(-4,24,2);
  L.g(6,25).se(-3,25);
  L.pit(4).g(3,22);
  L.pit(4).g(3,25).fk(-1,27);
  L.pit(6).mvp(-5,22,2,3,0,3);
  L.g(10,22).bl(-1).spk(-8).cr(-5,22);
  L.goal(22);return L;}
function level7(){const L=new LB(22);L.ceil();
  L.g(8).fk(-4,6);
  L.g(10).st(-7).st(-4).spk(-5).cr(-2);
  L.pit(4).brk(-3,6,1).fk(-3,8);
  L.g(3,7);
  L.pit(3).g(2,10).fk(-1,12);
  L.pit(5).mvp(-4,10,2,3,0,2.8);
  L.g(8,10).se(-4,10).st(-6).st(-2);
  L.g(3,10).dr(-2);
  L.pit(4).g(1,8);
  L.pit(3).g(1,11);
  L.pit(4).g(6,9).cr(-3,9).fk(-2,11);
  L.pit(6).p(-5,9,1).brk(-2,11,1);
  L.g(12,8).se(-8,8).st(-10).st(-7).st(-4).spk(-5);
  L.pit(5).mvp(-4,6,2,0,6,3.5);
  L.g(5,13).fk(-3,15);
  L.pit(4).g(2,10);
  L.pit(4).g(2,12);
  L.pit(3).g(3,9);
  L.goal(9);return L;}
function level8(){const L=new LB(26);L.ceil();
  L.g(8).fk(-4,6);
  L.pit(3).g(3,7).st(-2);
  L.pit(3).g(3,10).cr(-2,10);
  L.pit(4).g(2,13).fk(-1,15);
  L.pit(6).mvp(-5,13,2,3,0,2.6);
  L.g(10,13).se(-5,13).st(-8).st(-6).st(-3).dr(-1);
  L.pit(5).brk(-4,11,1).brk(-2,9,1);
  L.g(4,7);

function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function moveBody(b,dt){

  if(b.vx>0){const c=Math.floor((b.x+b.w)/T);for(let r=r0;r<=r1;r++)if(solid(c,r)){b.x=c*T-b.w-0.01;b.vx=0;b.hitWall=1;break;}}

  if(b.vy>0){const r=Math.floor((b.y+b.h)/T);for(let c=c0;c<=c1;c++)if(solid(c,r)){b.y=r*T-b.h;b.vy=0;b.onGround=true;break;}}

function update(dt){

    if(P.vy>=0)for(const m of LV.movers){if(P.prevBottom<=m.py+8&&P.y+P.h>=m.y&&P.x+P.w>m.x+3&&P.x<m.x+m.w-3){P.y=m.y-P.h;P.vy=0;P.onGround=true;P.onPlat=m;break;}}
    if(P.onGround&&wasAir){P.squash=0.15;puff(P.x+P.w/2,P.y+P.h,6);}
    if(P.squash>0)P.squash=Math.max(0,P.squash-dt);else if(P.squash<0)P.squash=Math.min(0,P.squash+dt*0.6);
    if(P.onGround&&Math.abs(P.vx)>20)P.walkT+=dt*Math.abs(P.vx)/30;
    if(P.inv>0)P.inv-=dt;
    if(P.hurt){P.hurtT+=dt;if(!P.onGround)P.leftGround=true;
      if((P.leftGround&&P.onGround)||P.hurtT>2.5){P.hurt=false;P.vx*=0.3;
        if(hearts<=0){state='gameover';stateT=0;SFX.over();setMenuBtn(true);return;}
        P.inv=0.4;}}
    // water
    if(P.y+P.h>LV.waterY+22){
      SFX.splash();for(let i=0;i<20;i++)particles.push({x:P.x+P.w/2,y:LV.waterY+4,vx:(Math.random()-.5)*240,vy:-Math.random()*380,life:.7,max:.7,c:i%3?'#8fd3ff':'#ffffff',s:4,g:900});
      hearts--;livesLost++;P.dead=1.0;P.alpha=0;P.hurt=false;SFX.hurt();
      popups.push({x:P.x+P.w/2,y:LV.waterY-30,txt:'-1',c:'#ff6b6b',t:0});
    }
    // últim nivell: arribar als amics acaba el joc
    if(isLast()&&P.onGround&&P.x+P.w/2>doorX()-90&&state==='play'){state='enter';stateT=0;P.vx=0;SFX.win();setTargets([]);}
    // pantalla d'introducció: sortir per la dreta comença el nivell 1
    if(tut&&P.x+P.w>=LV.w*T-4&&state==='play'){startLevel(0);fadeIn=0.8;return;}
    // checkpoints
    for(const c of LV.cps)if(!c.on&&P.x>c.x){c.on=true;LV.respawn={x:c.x,y:c.y-P.h};SFX.cp();popups.push({x:c.x+10,y:c.y-70,txt:'PUNT DE CONTROL',c:'#7dff9a',t:0,small:true});}
    // goal
  }

  updateDoors(dt);
  // ---- estalagmites del terra ----
  if(P.dead<=0)for(const k of LV.spikes)if(overlap(P,{x:k.x-8,y:k.y-34,w:16,h:34}))hurt(k.x);
  // ---- plataformes esquerdades ----
  for(const b of LV.brk){
    if(b.st==='ok'){const on=P.dead<=0&&P.onGround&&!P.onPlat&&Math.floor((P.y+P.h+1)/T)===b.row&&P.x+P.w>b.c*T&&P.x<(b.c+b.len)*T;
      if(on){b.t+=dt;if(b.t>0.9){b.st='shake';b.t=0;SFX.crack();}}else b.t=Math.max(0,b.t-dt*0.5);}
    else if(b.st==='shake'){b.t+=dt;if(b.t>0.35){b.st='gone';b.t=0;for(let i=0;i<b.len;i++)LV.map[(b.c+i)*LV.R+b.row]=0;SFX.crack();
      for(let i=0;i<24;i++)particles.push({x:b.c*T+Math.random()*b.len*T,y:b.row*T+Math.random()*T,vx:(Math.random()-.5)*160,vy:-Math.random()*150,life:.9,max:.9,c:i%2?'#dff6ff':'#7cc0e2',s:5,g:1000});}}
    else if(b.t+=dt,b.t>4&&!overlap(P,{x:b.c*T,y:b.row*T-4,w:b.len*T,h:T+4})){b.st='ok';b.t=0;for(let i=0;i<b.len;i++)LV.map[(b.c+i)*LV.R+b.row]=5;puff(b.c*T+b.len*T/2,b.row*T,10,'#dff6ff');}
  }
  // ---- enemies ----
  for(const e of LV.enemies){
    if(!e.alive){e.deadT-=dt;continue;}
    if(Math.abs(e.x-P.x)>W*1.2)continue;
    e.anim+=dt;
    if(e.evil&&e.onGround&&Math.abs(P.x-e.x)<260&&Math.abs(P.y-e.y)<70&&P.dead<=0){const d=P.x<e.x?-1:1,fc=d>0?Math.floor((e.x+e.w+2)/T):Math.floor((e.x-2)/T);if(solid(fc,Math.floor((e.y+e.h+2)/T))&&!solid(fc,Math.floor((e.y+e.h-4)/T)))e.dir=d;} // persegueix el pingüí
    if(e.stun>0){e.stun-=dt;e.vx=0;}else e.vx=e.dir*e.speed;
    e.vy=Math.min(e.vy+G*dt,900);
    moveBody(e,dt);
    if(e.hitWall)e.dir*=-1;
    if(e.onGround&&e.stun<=0){const fc=e.dir>0?Math.floor((e.x+e.w+2)/T):Math.floor((e.x-2)/T);const rr=Math.floor((e.y+e.h+2)/T);if(!solid(fc,rr))e.dir*=-1;}
    if(e.y>LV.R*T+40){e.alive=false;continue;}
    if(P.dead<=0&&!P.hurt&&overlap(P,e)){
      if(P.vy>0&&P.prevBottom<=e.y+10){
        P.vy=keys.j?-620:-430;P.y=e.y-P.h;SFX.stomp();
        e.hp--;
        if(e.hp<=0){e.alive=false;e.deadT=0.6;puff(e.x+e.w/2,e.y+e.h/2,10,'#ffd0c0');popups.push({x:e.x+e.w/2,y:e.y-10,txt:'PAF!',c:'#ffe066',t:0});}
        else{e.stun=1.2;P.vx=(P.x+P.w/2<e.x+e.w/2?-1:1)*230;puff(e.x+e.w/2,e.y,8);popups.push({x:e.x+e.w/2,y:e.y-10,txt:'1 MÉS!',c:'#ffe066',t:0,small:true});}
      }else if(e.stun<=0)hurt(e.x+e.w/2);
    }
  }
  // ---- icicles ----
  for(const ic of LV.ices){
    if(ic.st==='gone')continue;
    const pcx=P.x+P.w/2;
    const rg=ic.rock?110:85;
    if(ic.st==='hang'){if(P.dead<=0&&pcx>ic.x-rg&&pcx<ic.x+ic.w+rg&&P.y>ic.y){ic.st='shake';ic.t=0;}}
    else if(ic.st==='shake'){ic.t+=dt;if(ic.t>(ic.warn||0.45)){ic.st='fall';ic.vy=0;}}
    else if(ic.st==='fall'){ic.vy+=G*dt;ic.y+=ic.vy*dt;
      if(solid(Math.floor((ic.x+ic.w/2)/T),Math.floor((ic.y+ic.h)/T))||ic.y>LV.R*T){ic.st='gone';SFX.crack();
        for(let i=0;i<12;i++)particles.push({x:ic.x+ic.w/2,y:ic.y+ic.h,vx:(Math.random()-.5)*260,vy:-Math.random()*260,life:.6,max:.6,c:i%2?'#dff6ff':'#8fd3ff',s:3,g:900});}}
    if(ic.st!=='gone'&&P.dead<=0&&overlap(P,{x:ic.x+2,y:ic.y,w:ic.w-4,h:ic.h}))hurt(ic.x+ic.w/2);
  }
  // ---- estalactites que cauen soles a les coves ----
  if(LV.info.cave&&!locked&&P.dead<=0){LV.dropT=(LV.dropT??2)-dt;
    if(LV.dropT<=0){LV.dropT=1.8+Math.random()*1.4;
      const c=Math.floor((P.x+P.w/2+P.face*(110+Math.random()*200))/T);
      if(tileAt(c,0)===4){let r=0;while(r<LV.R&&tileAt(c,r)===4)r++;
        LV.ices.push({x:c*T+8,y:r*T,w:16,h:50,vy:0,st:'shake',t:0,warn:0.7,rock:true});}}}
  // ---- snowballs ----
  for(const s of LV.sp){
    if(!s.alive){s.deadT-=dt;continue;}
    s.anim+=dt;
    if(P.x<s.x-60&&P.x>s.x-820){s.t-=dt;
      if(s.t<=0.22&&!s.thrown){s.thrown=true;balls.push({x:s.x-38,y:s.y-70,w:28,h:28,vx:-60,vy:-90,rot:0,alive:true,g:0});} // surt de la mà, petita
      if(s.t<=0){s.t=3.3;s.thrown=false;}}
    else s.t=Math.max(s.t,1.2);
    // el ninot fa mal si el toques; si el trepitges, desapareix
    const box={x:s.x-22,y:s.y-70,w:44,h:70};
    if(P.dead<=0&&!P.hurt&&overlap(P,box)){
      if(P.vy>0&&P.prevBottom<=box.y+12){s.alive=false;s.deadT=0.6;P.vy=keys.j?-620:-430;SFX.stomp();puff(s.x,s.y-35,18,'#ffffff',220);popups.push({x:s.x,y:s.y-80,txt:'PAF!',c:'#ffe066',t:0});}
      else hurt(s.x);}
  }
  for(const b of balls){
    b.g=(b.g??1)+dt;b.vx=-175*Math.min(1,0.35+0.65*b.g/0.6);b.vy=Math.min(b.vy+G*dt,900);moveBody(b,dt);b.rot-=175*dt/14;
    if(b.onGround&&Math.random()<0.3)particles.push({x:b.x+b.w,y:b.y+b.h,vx:30,vy:-30,life:.3,max:.3,c:'#fff',s:3,g:200});
    if(b.hitWall){b.alive=false;SFX.crack();puff(b.x+b.w/2,b.y+b.h/2,14,'#ffffff',200);continue;}
    if(b.y>LV.R*T+40){b.alive=false;continue;}
    if(P.dead<=0&&!P.hurt&&overlap(P,(()=>{const r=ballR(b);return {x:b.x+b.w/2-r+3,y:b.y+b.h-2*r+3,w:2*r-6,h:2*r-6};})())){
      if(P.vy>0&&P.prevBottom<=b.y+10){b.alive=false;P.vy=keys.j?-620:-430;SFX.stomp();puff(b.x+b.w/2,b.y+b.h/2,16,'#ffffff',220);popups.push({x:b.x+b.w/2,y:b.y-10,txt:'CRAC!',c:'#bff0ff',t:0});}
      else hurt(b.x+b.w/2);
    }
  }
  balls=balls.filter(b=>b.alive);
  for(const f of LV.fish){f.t+=dt;if(f.shake>0)f.shake-=dt;}
  for(const c of LV.cps)c.t+=dt;
  updateParticles(dt);
  // camera
  const target=clamp(P.x+P.w/2-W*0.4,0,LV.w*T-W);
  camX+= (target-camX)*Math.min(1,dt*8);
  const ty=clamp(P.y+P.h/2-H*0.55,0,LV.R*T-H);camY+=(ty-camY)*Math.min(1,dt*6);
  for(const d of LV.doors)if(d.shake>0)d.shake-=dt;
  // on-screen keyboard targets
  setTargets(P.dead>0?[]:[...new Set(inRangeFish().map(f=>f.l).concat(inRangeDoors().map(d=>d.l)).concat(atIglooDoor()?['k']:[]))]);
}
function updateParticles(dt){
  for(const p of particles){p.life-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  particles=particles.filter(p=>p.life>0);
  for(const f of flyFish)f.t+=dt;flyFish=flyFish.filter(f=>f.t<0.6);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<1);
}
function updateFlakes(dt){const wind=state!=='menu'&&LV&&LV.info.fx==='storm';
  if(!flakes.length)for(let i=0;i<45;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,s:1+Math.random()*2.5,v:20+Math.random()*40,ph:Math.random()*6});
  for(const f of flakes){f.y+=f.v*dt*(wind?2.2:1);f.x+=Math.sin(gT+f.ph)*15*dt-(wind?220*dt*f.s/2:0);if(f.x<0)f.x+=W;if(f.y>H){f.y=-5;f.x=Math.random()*W;}}
}
function finishLevel(){
  const tot=LV.fish.length,info=LV.info;
  const flags=[true,fishGot>=Math.ceil(tot/2),fishGot===tot,timeT<=info.target,livesLost===0];
  lastRes={level:levelN,fish:fishGot,tot,time:timeT,target:info.target,livesLost,flags,stars:flags.filter(Boolean).length,sfxShown:0};
  results[levelN]=lastRes;state='clear';stateT=0;setTargets([]);
}

// ====================== PIXEL FONT ======================
const PF={G:['01111','10000','10000','10111','10001','10001','01111'],N:['10001','11001','10101','10101','10011','10001','10001'],I:['11111','00100','00100','00100','00100','00100','11111'],
V:['10001','10001','10001','10001','01010','01010','00100'],E:['11111','10000','10000','11110','10000','10000','11111'],
L:['10000','10000','10000','10000','10000','10000','11111'],S:['01111','10000','10000','01110','00001','00001','11110'],
U:['10001','10001','10001','10001','10001','10001','01110'],P:['11110','10001','10001','11110','10000','10000','10000'],
R:['11110','10001','10001','11110','10100','10010','10001'],A:['01110','10001','10001','11111','10001','10001','10001'],
T:['11111','00100','00100','00100','00100','00100','00100'],'!':['00100','00100','00100','00100','00100','00000','00100']};
function pixelWord(str,cx,cy,b,t){
  const n=str.length,w=n*6*b-b;let x0=Math.round(cx-w/2);
  const grad=['#fff7c2','#ffe066','#ffd23f','#ffb627','#ff9f1c','#f78c1f','#e8701a'];
  [...str].forEach((ch,i)=>{const g=PF[ch];if(!g)return;
    const k=clamp((t-i*0.06)/0.25,0,1);if(k<=0)return;
    const oy=Math.round(-Math.sin(k*Math.PI)*b*3-(1-k)*b*6+Math.sin(gT*6+i*0.5)*b*0.4);
    const x=x0+i*6*b,y=Math.round(cy-3.5*b)+oy;
    ctx.fillStyle='#0b1a33';for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(g[r][c]==='1')ctx.fillRect(x+c*b-b/2,y+r*b-b/2,b*2,b*2);
    ctx.fillStyle='#7a3b10';for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(g[r][c]==='1')ctx.fillRect(x+c*b+b/3,y+r*b+b/3,b,b);
    for(let r=0;r<7;r++){ctx.fillStyle=grad[r];for(let c=0;c<5;c++)if(g[r][c]==='1')ctx.fillRect(x+c*b,y+r*b,b,b);}
    ctx.fillStyle='rgba(255,255,255,.8)';for(let c=0;c<5;c++)if(g[0][c]==='1')ctx.fillRect(x+c*b,y,b,Math.max(2,b/4));});
}
function drawClear(){
  pixelWord('NIVELL',W/2,H/2-50,9,stateT);
  pixelWord('SUPERAT!',W/2,H/2+40,9,stateT-0.35);
  const a=clamp((stateT-2.2)/0.7,0,1);if(a>0){ctx.fillStyle=`rgba(0,0,0,${a})`;ctx.fillRect(0,0,W,H);}
}

function txt(s,x,y,size,col='#fff',align='center',outline='#0b1a33',lw){
  ctx.font=`${size}px "Press Start 2P", monospace`;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.lineJoin='round';const L=lw??Math.max(3,size/3.2);if(L>0){ctx.lineWidth=L;ctx.strokeStyle=outline;ctx.strokeText(s,x,y);}ctx.fillStyle=col;ctx.fillText(s,x,y);}
function fmtTime(t){t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function panel(x,y,w,h,col='rgba(10,24,48,.88)',border='#7cc4f0'){
  ctx.fillStyle='#050c18';ctx.fillRect(x-6,y-6,w+12,h+12);ctx.fillStyle=border;ctx.fillRect(x-4,y-4,w+8,h+8);ctx.fillStyle=col;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,w,4);}

function tileLayer(im,off,mirror=true){const bw=im.width;let k=Math.floor(off/bw);
  for(;k*bw-off<W;k++){const x=Math.round(k*bw-off);
    if(mirror&&k%2){ctx.save();ctx.translate(x+bw,0);ctx.scale(-1,1);ctx.drawImage(im,0,0);ctx.restore();}else ctx.drawImage(im,x,0);}}
function drawBg(name,cam,par=0.3){
  if(IMG[name+'_cel']&&IMG[name+'_terra']){ // parallax en dues capes: cel (lent, amb deriva) i terra
    tileLayer(IMG[name+'_cel'],cam*par*0.25+gT*4,false);tileLayer(IMG[name+'_terra'],cam*par);return;}
  const im=IMG[name];if(!im){ctx.fillStyle='#7ec3ee';ctx.fillRect(0,0,W,H);return;}
  const bw=im.width,off=cam*par;let k=Math.floor(off/bw);
  for(;k*bw-off<W;k++){const x=Math.round(k*bw-off);
    if(k%2){ctx.save();ctx.translate(x+bw,0);ctx.scale(-1,1);ctx.drawImage(im,0,0);ctx.restore();}else ctx.drawImage(im,x,0);}
}
function drawWater(){
  const y=LV.waterY,bot=LV.R*T+8;
  const cave=LV.info.cave;
  ctx.fillStyle=cave?'#141f45':'#1f5f9e';ctx.fillRect(0,y,W,bot-y);
  ctx.fillStyle=cave?'#1f3170':'#2f7cc4';ctx.fillRect(0,y+8,W,bot-y);
  ctx.fillStyle='#3f93d8';
  for(let i=0;i<4;i++){const yy=y+22+i*14;for(let x=-40;x<W;x+=80){const xx=x+((gT*30*(i%2?1:-1)+i*37-camX*0.6)%80+80)%80;ctx.fillRect(xx,yy,26,2);}}
  ctx.fillStyle='#bfe8ff';
  for(let x=0;x<W;x+=8){const h=Math.sin((x+camX)*0.05+gT*3)*2;ctx.fillRect(x,y+h,8,3);}
}
function drawTiles(){
  const c0=Math.max(0,Math.floor(camX/T)),c1=Math.min(LV.w-1,Math.floor((camX+W)/T));
  const r0=Math.max(0,Math.floor(camY/T)),r1=Math.min(LV.R-1,Math.floor((camY+H)/T));
  for(let c=c0;c<=c1;c++)for(let r=r0;r<=r1;r++){
    const t=tileAt(c,r);if(!t)continue;
    if(t===3)continue;
    const ab=tileAt(c,r-1),top=ab===0||ab===3||ab===4;
    const x=Math.round(c*T-camX),y=r*T;
    if(t===2||t===5)continue;
    if(t===4){ctx.drawImage(TILE.rock,x,y);if(!tileAt(c,r+1)){ctx.fillStyle='#2c2a48';ctx.fillRect(x+4,y+T,8,6);ctx.fillRect(x+6,y+T+6,4,4);ctx.fillRect(x+20,y+T,6,4);ctx.fillStyle='#8fb2e0';ctx.fillRect(x+7,y+T+9,2,2);}continue;}
    const cave=LV.info.cave;
    ctx.drawImage(t===1?(top?(cave?TILE.cTop:TILE.gTop):(cave?TILE.cMid:TILE.gMid)):(top?TILE.iTop:TILE.iMid),x,y);
    if(top){ // snow lips
      if(!tileAt(c-1,r)){ctx.fillStyle='#f4fbff';ctx.fillRect(x-4,y,4,8);ctx.fillStyle='#c7e2f3';ctx.fillRect(x-4,y+8,4,2);}
      if(!tileAt(c+1,r)){ctx.fillStyle='#f4fbff';ctx.fillRect(x+T,y,4,8);ctx.fillStyle='#c7e2f3';ctx.fillRect(x+T,y+8,4,2);}
    }
  }
}
function doorX(){return LV.goalX*T+16;}
function isLast(){return levelN===LEVELS.length-1;}
function atIglooDoor(){return !isLast()&&P.dead<=0&&!P.hurt&&P.onGround&&Math.abs(P.x+P.w/2-doorX())<22&&Math.abs(P.y+P.h-topAt(LV.goalX)*T)<4;}
function drawFriends(){ // últim nivell: pingüins saltant de felicitat
  const gy=topAt(LV.goalX)*T;
  const pos=[[-40,0.0,true],[30,0.35,true],[95,0.7,true],[160,0.2,true],[225,0.55,true],[290,0.9,true]];

    if(j>28&&Math.floor(gT*6+ph*10)%2===0){ctx.fillStyle='#ffd23f';ctx.fillRect(x-22,gy-70-j,4,4);ctx.fillRect(x+18,gy-74-j,4,4);ctx.fillStyle='#ff6fa8';ctx.fillRect(x-4,gy-82-j,4,4);}}
  if(state==='play'&&P.x+P.w/2<doorX()-90)txt('♥',Math.round(doorX()+125-camX),gy-120+Math.sin(gT*3)*5,22,'#ff6fa8');
}
function drawIgloo(){

    txt('K',dx,by-1,16,'#0b1a33','center','#0b1a33',0);}
}
function drawCheckpoints(){
  for(const c of LV.cps){const x=Math.round(c.x-camX),y=c.y;if(x<-40||x>W+40)continue;
    ctx.fillStyle='#38475e';ctx.fillRect(x,y-52,4,52);ctx.fillStyle='#dfe8f2';ctx.fillRect(x-2,y-56,8,6);
    const w=Math.sin(c.t*6)*3,fy=c.on?y-52:y-22;
    ctx.fillStyle=c.on?'#3fd36b':'#d8433a';ctx.beginPath();ctx.moveTo(x+4,fy);ctx.lineTo(x+30,fy+7+w);ctx.lineTo(x+4,fy+16);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.fillRect(x+9,fy+6,6,4);}
}
function drawSpawners(){
  for(const s of LV.sp){if(!s.alive&&s.deadT<=0)continue;const x=Math.round(s.x-camX),y=s.y+2;if(x<-80||x>W+80)continue;
    if(!s.alive)ctx.globalAlpha=Math.max(0,s.deadT/0.6);
    const sq=s.alive?1:0.4;
    if(s.alive&&s.t<0.7&&IMG.ninot_tira)frame(IMG.ninot_tira,40,Math.min(6,Math.floor((0.7-s.t)/0.1)),x,y,false,sq,1.6); // llança
    else if(s.alive&&s.t<1.0&&IMG.ninot)frame(IMG.ninot,45,s.t>0.85?7:6,x,y,false,sq,1.6);   // gira cap a l'esquerra
    else if(s.alive&&s.t>3.0&&s.t<=3.3&&IMG.ninot)frame(IMG.ninot,45,s.t>3.15?6:7,x,y,false,sq,1.6); // torna a mirar endavant
    else if(IMG.ninot_respira)frame(IMG.ninot_respira,IMG.ninot_respira.width/4,Math.floor(s.anim*4)%4,x,y,false,sq,1.6); // respira
    ctx.globalAlpha=1;}
}
function ballR(b){return 14*(0.3+0.7*clamp((b.g??1)/0.6,0,1));} // creix des de la mà
function drawBallAt(x,y,r,rot){
  ctx.fillStyle='#0b1a33';ctx.beginPath();ctx.arc(x,y,r+2,0,7);ctx.fill();
  ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle='#c7e2f3';ctx.beginPath();ctx.arc(x+r*0.25,y+r*0.25,r*0.75,0,7);ctx.fill();
  ctx.fillStyle='#f4fbff';ctx.beginPath();ctx.arc(x-r*0.15,y-r*0.15,r*0.7,0,7);ctx.fill();
  ctx.fillStyle='#a9cde6';for(let i=0;i<3;i++){const a=rot+i*2.1;ctx.fillRect(Math.round(x+Math.cos(a)*r*0.55)-2,Math.round(y+Math.sin(a)*r*0.55)-2,4,4);}
}
function drawFish(){
  const near=new Set(P.dead>0?[]:inRangeFish());
  for(const f of LV.fish){if(f.got)continue;const x=f.x-camX;if(x<-40||x>W+40)continue;
    const y=f.y+Math.sin(f.t*3)*5,sh=f.shake>0?Math.sin(f.shake*80)*3:0;
    if(IMG.peix)frame(IMG.peix,47,Math.floor(f.t*3.5)%8,Math.round(x+sh),Math.round(y+23),false,1,1.05);
    // letter bubble
    const n=near.has(f),bx=Math.round(x+sh),by=Math.round(y-44);
    const s=n?30+Math.sin(gT*10)*2:24;
    ctx.globalAlpha=n?1:0.75;
    ctx.fillStyle='#0b1a33';ctx.fillRect(bx-s/2-2,by-s/2-2,s+4,s+6);
    ctx.fillStyle=n?'#ffffff':'#dbeefa';ctx.fillRect(bx-s/2,by-s/2,s,s);
    ctx.fillStyle=n?FISH_COLORS[f.l]:'#9fb7cc';ctx.fillRect(bx-s/2,by+s/2-4,s,4);
    txt(f.l.toUpperCase(),bx,by-1,n?16:12,'#0b1a33','center','#0b1a33',0);
    ctx.globalAlpha=1;

}
function frame(im,cw,i,x,y,flipX,sq=1,sc=1){ // dibuixa el fotograma i d'una tira; (x,y)=centre inferior
  const ch=im.height;ctx.save();ctx.translate(x,y);if(flipX)ctx.scale(-1,1);ctx.scale(sc,sc*sq);
  ctx.drawImage(im,i*cw,0,cw,ch,-cw/2,-ch,cw,ch);ctx.restore();}
function drawEnemies(){
  const pcx=P.x+P.w/2;
  for(const e of LV.enemies){
    if(!e.alive&&e.deadT<=0)continue;const x=Math.round(e.x-camX+e.w/2),y=Math.round(e.y+e.h+1);if(x<-80||x>W+80)continue;
    const dead=!e.alive;if(dead)ctx.globalAlpha=Math.max(0,e.deadT/0.6);
    const sq=dead?0.45:1;

      if(e.evil&&IMG.cranc_dolent)frame(IMG.cranc_dolent,47,dead?0:Math.floor(e.anim*14)%9,x,y+2,false,sq);

      frame(im,IMG.foca.width/8,fi,x,y+4,e.dir<0,sq,1.6);
      if(e.stun>0&&!dead){for(let i=0;i<3;i++){const a=gT*5+i*2.1;ctx.fillStyle='#ffe066';ctx.fillRect(x+Math.cos(a)*24-3,y-76+Math.sin(a)*6-3,6,6);}}
    }
    ctx.globalAlpha=1;
  }
}
function drawIcicles(){
  for(const ic of LV.ices){if(ic.st==='gone')continue;const sh=ic.st==='shake'?Math.sin(gT*90)*2:0;
    const x=Math.round(ic.x-camX+sh),y=Math.round(ic.y);if(x<-30||x>W+30)continue;
    const sim=ic.rock?IMG.estalactita_gran:IMG.estalactita;
    if(sim){ctx.drawImage(sim,Math.round(x+ic.w/2-sim.width/2),y-(ic.rock?10:2));
      if(ic.st==='shake'&&ic.warn){ctx.fillStyle='rgba(220,210,255,.8)';for(let i=0;i<3;i++)ctx.fillRect(x+Math.random()*ic.w,y-4+Math.random()*6,3,3);}
      continue;}
    if(ic.rock){
      ctx.fillStyle='#0b0a1a';ctx.beginPath();ctx.moveTo(x-2,y);ctx.lineTo(x+ic.w+2,y);ctx.lineTo(x+ic.w/2+1,y+ic.h+3);ctx.fill();
      ctx.fillStyle='#5a5790';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+ic.w,y);ctx.lineTo(x+ic.w/2,y+ic.h);ctx.fill();
      ctx.fillStyle='#8f8cc8';ctx.beginPath();ctx.moveTo(x+3,y);ctx.lineTo(x+7,y);ctx.lineTo(x+ic.w/2,y+ic.h-6);ctx.fill();
      ctx.fillStyle='#bfe0ff';ctx.fillRect(x+ic.w/2-1,y+ic.h-8,2,4);
      if(ic.st==='shake'&&ic.warn){ctx.fillStyle='rgba(200,190,255,.7)';for(let i=0;i<3;i++)ctx.fillRect(x+Math.random()*ic.w,y-4+Math.random()*6,3,3);}
      continue;}
    ctx.fillStyle='#0b1a33';ctx.beginPath();ctx.moveTo(x-2,y);ctx.lineTo(x+ic.w+2,y);ctx.lineTo(x+ic.w/2,y+ic.h+3);ctx.fill();
    ctx.fillStyle='#9fdcf6';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+ic.w,y);ctx.lineTo(x+ic.w/2,y+ic.h);ctx.fill();
    ctx.fillStyle='#e9fbff';ctx.beginPath();ctx.moveTo(x+2,y);ctx.lineTo(x+6,y);ctx.lineTo(x+ic.w/2,y+ic.h-4);ctx.fill();
    ctx.fillStyle='#f4fbff';ctx.fillRect(x-2,y,ic.w+4,4);}
}
function drawPenguin(){
  if(P.dead>0||!IMG.pingui)return;
  if(!P.hurt&&P.inv>0&&Math.floor(P.inv*14)%2)return;
  const px=Math.round(P.x+P.w/2-camX),py=Math.round(P.y+P.h+3);
  ctx.save();ctx.globalAlpha=P.alpha;
  if(P.hurt&&IMG.cop){ // animació de perdre una vida
    const fi=Math.min(6,Math.floor(P.hurtT/0.1));frame(IMG.cop,56,fi,px,py,P.face<0);ctx.restore();return;}
  if(!P.onGround&&!P.onPlat&&IMG.salt){ // animació de salt segons la velocitat vertical
    const fi=P.vy<-520?2:P.vy<-300?3:P.vy<-90?4:P.vy<120?5:P.vy<380?6:7;
    frame(IMG.salt,61,fi,px,py,P.face<0);ctx.restore();return;}
  const walking=P.onGround&&Math.abs(P.vx)>20&&(keys.f||keys.s);
  if(walking&&IMG.camina){frame(IMG.camina,60,Math.floor(P.walkT*1.6)%9,px,py,P.face<0);ctx.restore();return;}
  const im=IMG.pingui;let sx=1,sy=1,ang=0;
  if(P.squash>0){sy=1-P.squash*1.2;sx=1+P.squash*1.1;}
  else if(P.squash<0){sy=1-P.squash*0.9;sx=1+P.squash*0.6;}
  if(!P.onGround){sy*=P.vy<0?1.06:1;sx*=P.vy<0?0.95:1;ang=clamp(P.vx/MAXV,-1,1)*0.08;}
  else if(Math.abs(P.vx)>60){ang=-Math.sign(P.vx)*0.18;} // llisca pel gel
  ctx.translate(px,py);ctx.rotate(ang);ctx.scale(P.face*sx,sy);
  ctx.drawImage(im,-im.width/2,-im.height);ctx.restore();
}

  for(const p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x-camX-p.s/2),Math.round(p.y-p.s/2),p.s,p.s);}
  ctx.globalAlpha=1;
  for(const p of popups){ctx.globalAlpha=1-p.t;txt(p.txt,p.x-camX,p.y-p.t*40,p.small?9:14,p.c);}ctx.globalAlpha=1;
}
function slab(im,x,y,w,h,cs){if(!im)return;const sh=im.height,cd=Math.min(w/2,cs*h/sh);
  ctx.drawImage(im,0,0,cs,sh,x,y,cd,h);ctx.drawImage(im,cs,0,im.width-2*cs,sh,x+cd,y,w-2*cd,h);ctx.drawImage(im,im.width-cs,0,cs,sh,x+w-cd,y,cd,h);}
function drawSlabs(){
  const cave=LV.info.cave,im=cave?IMG.plat_roca:IMG.plat_gel;
  const c0=Math.max(0,Math.floor(camX/T)-20),c1=Math.min(LV.w-1,Math.floor((camX+W)/T)+1);
  const r0=Math.max(0,Math.floor(camY/T)),r1=Math.min(LV.R-1,Math.floor((camY+H)/T));
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){if(tileAt(c,r)!==2||tileAt(c-1,r)===2)continue;
    let n=1;while(tileAt(c+n,r)===2)n++;
    const x=Math.round(c*T-camX);if(x>W||x+n*T<0)continue;
    if(cave)slab(im,x-3,r*T-3,n*T+6,46,34);else slab(im,x-3,r*T-2,n*T+6,40,24);}
  for(const b of LV.brk){if(b.st==='gone')continue;const x=Math.round(b.c*T-camX);if(x>W||x+b.len*T<0)continue;
    const sh=b.st==='shake'?Math.sin(gT*70)*3:(b.t>0.4?Math.sin(gT*50)*1.2:0);
    ctx.drawImage(IMG.plat_esquerdada,x-3+sh,b.row*T-3,b.len*T+6,38);
    if(b.t>0.3&&b.st==='ok'){ctx.fillStyle=`rgba(20,40,80,${Math.min(0.35,b.t*0.3)})`;ctx.fillRect(x+sh,b.row*T,b.len*T,30);}}
}
function drawSpikes(){for(const k of LV.spikes){const im=IMG[k.im];if(!im)continue;const x=Math.round(k.x-camX);if(x<-40||x>W+40)continue;ctx.drawImage(im,x-im.width/2,k.y-im.height+4);}}
function drawDeco(){
  for(const d of LV.deco){const x=Math.round(d.x-camX);if(x>W+10||x+d.im.width<-10)continue;
    if(d.flip){ctx.save();ctx.translate(x+d.im.width,0);ctx.scale(-1,1);ctx.drawImage(d.im,0,d.y-d.im.height);ctx.restore();}
    else ctx.drawImage(d.im,x,d.y-d.im.height);}

function icePanel(x,y,w,h){
  x=Math.round(x);y=Math.round(y);
  ctx.fillStyle='#0b1a33';ctx.fillRect(x-4,y-4,w+8,h+8);                    // contorn fosc
  ctx.fillStyle='#2a6f9e';ctx.fillRect(x-2,y-2,w+4,h+4);                    // vora de gel fosca
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#bfe9fb');g.addColorStop(0.18,'#7fcbef');g.addColorStop(1,'#3d8fc4');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(10,40,80,.55)';ctx.fillRect(x+10,y+18,w-20,h-30);       // interior glaçat (més fosc per llegir)
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x+10,y+18,w-20,3);
  ctx.fillStyle='#e9fbff';ctx.fillRect(x,y,w,4);ctx.fillRect(x,y,4,h);        // llum
  ctx.fillStyle='#ffffff';for(let k=0;k<w;k+=46){ctx.fillRect(x+12+k,y+7,10,2);ctx.fillRect(x+12+k,y+7,2,6);} // reflexos
  ctx.fillStyle='#24608c';ctx.fillRect(x,y+h-4,w,4);ctx.fillRect(x+w-4,y,4,h);
  // neu a sobre
  ctx.fillStyle='#0b1a33';ctx.fillRect(x-8,y-14,w+16,14);
  ctx.fillStyle='#f4fbff';ctx.fillRect(x-6,y-12,w+12,12);ctx.fillStyle='#ffffff';ctx.fillRect(x-6,y-12,w+12,3);
  ctx.fillStyle='#c7e2f3';for(let k=0;k<w+12;k+=4)ctx.fillRect(x-6+k,y-2+((k*7)%3),4,2);
  for(let k=20;k<w-20;k+=73){const d=5+((k*13)%6);ctx.fillStyle='#0b1a33';ctx.fillRect(x+k-2,y-1,12,d+2);ctx.fillStyle='#f4fbff';ctx.fillRect(x+k,y-1,8,d);}
  // caramells a sota
  for(let k=14;k<w-10;k+=26){const L=8+((k*17)%14);
    ctx.fillStyle='#0b1a33';ctx.fillRect(x+k-1,y+h+4,8,L*0.5+2);ctx.fillRect(x+k+1,y+h+4,4,L+2);

}

  return new Promise(res=>{let t=0,jumped=false,jt=0;const iv=setInterval(()=>{t++;keys.f=dir>0;keys.s=dir<0;
    const ahead=dir>0?Math.floor((P.x+P.w+3)/T):Math.floor((P.x-3)/T);
    if(!jumped&&P.onGround&&t>3&&!solid(ahead,Math.floor((P.y+P.h+4)/T))){P.jumpBuf=0.13;keys.j=true;jumped=true;jt=t;}
