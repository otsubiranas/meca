<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test de nivell de mecanografia</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a1a;--panel:#14122b;--line:#2b2760;--cy:#3df5ff;--mg:#ff4fd8;--ye:#ffe14d;--gr:#5cff9b;--re:#ff5a6a;--tx:#e8e6ff;--dim:#8d89c9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:20px/1.5 "Courier New",ui-monospace,monospace;
 background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
main{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1,h2{font-family:"Press Start 2P","Courier New",monospace;font-weight:400;line-height:1.5;margin:0 0 18px}
h1{font-size:clamp(18px,4vw,28px);color:var(--cy);text-shadow:0 0 12px rgba(61,245,255,.55)}
h2{font-size:15px;color:var(--ye)}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:22px;margin-bottom:20px}
.hidden{display:none!important}
label{display:block;color:var(--dim);margin-bottom:6px}
input[type=text]{width:100%;font:inherit;font-size:24px;padding:10px 14px;background:#0b0a1a;color:var(--tx);border:2px solid var(--line);border-radius:4px}
input[type=text]:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(61,245,255,.25)}
button{font:inherit;font-weight:700;cursor:pointer;padding:10px 20px;border-radius:4px;border:2px solid var(--cy);background:var(--cy);color:#04121a;margin:14px 10px 0 0}
button.sec{background:transparent;color:var(--cy)}
button:focus-visible{outline:3px solid var(--ye);outline-offset:2px}
.stats{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px;color:var(--dim)}
.stats b{color:var(--ye);font-size:24px}
.bar{height:6px;background:#0b0a1a;border-radius:3px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .1s}
#text{position:relative;font-size:24px;line-height:1.7;white-space:pre-wrap;cursor:text;padding:6px 2px}
#text span{border-radius:2px}
#text .ok{color:var(--gr)}
#text .cur{background:var(--cy);color:#04121a}
#text .bad{background:var(--re)!important;color:#fff}
#ta{position:absolute;inset:0;width:100%;height:100%;opacity:0;resize:none;border:0}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin:6px 0 18px}
.big div{border:2px solid var(--line);border-radius:6px;padding:12px;text-align:center;color:var(--dim)}
.big b{display:block;font-family:"Press Start 2P",monospace;font-weight:400;font-size:22px;margin-top:6px}
.nivell{font-family:"Press Start 2P",monospace;font-size:16px;color:var(--mg);margin:6px 0 16px}
.keys{display:flex;gap:10px;flex-wrap:wrap}
.k{min-width:56px;text-align:center;padding:6px 10px;border:2px solid var(--re);border-bottom-width:5px;border-radius:6px;color:var(--re);font-weight:700}
.k small{display:block;color:var(--dim);font-size:14px;font-weight:400}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--ye);font-weight:700}
#msg{color:var(--dim);margin-top:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<h1>Test de nivell de mecanografia</h1>

<section id="s-name" class="panel">
  <h2>Abans de començar</h2>
  <label for="nom">Escriu el teu nom i cognom</label>
  <input type="text" id="nom" maxlength="30" autocomplete="off">
  <p id="err" style="color:var(--re);min-height:1.5em;margin:6px 0 0"></p>
  <button id="go">Començar el test</button>
  <button id="seeT" class="sec">Veure la taula</button>
</section>

<section id="s-test" class="panel hidden">
  <div class="stats"><span>Temps <b id="t">0</b> s</span><span>Velocitat <b id="v">0</b> ppm</span><span>Precisió <b id="p">100</b>%</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="text"><textarea id="ta" aria-label="Escriu aquí el text" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
</section>

<section id="s-res" class="panel hidden">
  <h2 id="rn"></h2>
  <div class="nivell" id="rl"></div>
  <div class="big">
    <div>Velocitat<b id="rv" style="color:var(--cy)"></b>ppm</div>
    <div>Precisió<b id="rp" style="color:var(--gr)"></b></div>
    <div>Temps<b id="rt" style="color:var(--ye)"></b></div>
  </div>
  <h2>Tecles més fallades</h2>
  <div class="keys" id="rk"></div>
  <p id="msg"></p>
  <button id="seeT2">Veure la taula</button>
  <button id="again" class="sec">Tornar a començar</button>
</section>

<section id="s-tab" class="panel hidden">
  <h2>Resultats de tots els alumnes</h2>
  <p id="tmode" style="color:var(--dim);margin-top:0"></p>
  <div class="wrap"><table>
    <thead><tr><th>#</th><th>Nom</th><th>ppm</th><th>Precisió</th><th>Nivell</th><th>Tecles fallades</th><th>Data</th></tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <button id="csv">Descarregar CSV</button>
  <button id="back" class="sec">Tornar</button>
</section>
</main>

<script>
// Adreça de l'Apps Script (Google Sheets). Si és buida, els resultats es guarden només en aquest navegador.
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzbdkyne_aGnybfvaEz8wtIvQLaMnAh0h27AzhruhlPDfhPcpP1ioP3afRsZkjISjWC/exec";

const TEXT = "Escriure bé és més important que escriure ràpid. Abans de començar, seu amb l’esquena recta i col·loca bé els dits sobre el teclat. La mà esquerra ha de tenir els dits sobre les tecles A, S, D i F, i la mà dreta sobre J, K, L i Ñ. Cada dit té les seves tecles. Intenta no mirar el teclat mentre escrius i fixa’t en el text de la pantalla. Prem cada tecla amb cura i no corris massa. És millor escriure a poc a poc i no fer errors que anar molt de pressa i equivocar-se. Mantén un ritme tranquil, deixa els espais correctes i revisa el que has escrit. Amb paciència i pràctica, cada dia escriuràs millor!";

const $ = id => document.getElementById(id);
const show = id => { for (const s of ["s-name","s-test","s-res","s-tab"]) $(s).classList.toggle("hidden", s !== id); };
let nom, idx, errs, keys, t0, timer, failed, done, spans, rows = [];

const textEl = $("text"), ta = $("ta");
function build() {
  textEl.querySelectorAll("span").forEach(s => s.remove());
  spans = [...TEXT].map(c => { const s = document.createElement("span"); s.textContent = c; textEl.appendChild(s); return s; });
}
function begin() {
  nom = $("nom").value.trim();
  if (nom.length < 2) { $("err").textContent = "Escriu el teu nom abans de començar."; $("nom").focus(); return; }
  $("err").textContent = "";
  idx = 0; errs = 0; keys = 0; t0 = 0; failed = {}; done = false;
  clearInterval(timer); build(); spans[0].className = "cur";
  ["t","v"].forEach(i => $(i).textContent = "0"); $("p").textContent = "100"; $("bar").style.width = "0";
  show("s-test"); ta.focus();
}
function secs() { return t0 ? (performance.now() - t0) / 1000 : 0; }
function ppm() { const m = secs() / 60; return m > 0 ? Math.round((idx / 5) / m) : 0; }
function prec() { return keys ? Math.round((keys - errs) / keys * 100) : 100; }
function tick() { $("t").textContent = Math.floor(secs()); $("v").textContent = ppm(); $("p").textContent = prec(); }

function press(ch) {
  if (done || ch === "\n" || ch === "\r") return;
  if (!t0) { t0 = performance.now(); timer = setInterval(tick, 250); }
  const exp = TEXT[idx];
  keys++;
  if (ch === exp || (exp === "’" && ch === "'")) {
    spans[idx].className = "ok"; idx++;
    if (idx < TEXT.length) spans[idx].className = "cur";
  } else {
    errs++; failed[exp] = (failed[exp] || 0) + 1;
    spans[idx].classList.add("bad");
    setTimeout(() => spans[idx] && spans[idx].classList.remove("bad"), 180);
  }
  $("bar").style.width = (idx / TEXT.length * 100) + "%";
  tick();
  if (idx >= TEXT.length) finish();
}
const flush = () => { const v = ta.value; ta.value = ""; for (const c of v) press(c); };
ta.addEventListener("input", e => { if (!e.isComposing) flush(); });
ta.addEventListener("compositionend", flush);
textEl.addEventListener("click", () => ta.focus());

const keyName = c => c === " " ? "espai" : c;
function nivell(p, pr) {
  const e = p * Math.pow(pr / 100, 2);
  return e < 8 ? "Inicial" : e < 15 ? "Bàsic" : e < 25 ? "Intermedi" : e < 35 ? "Avançat" : "Expert";
}
function finish() {
  done = true; clearInterval(timer); tick();
  const rec = { nom, ppm: ppm(), precisio: prec(), temps: Math.round(secs()), data: new Date().toISOString() };
  rec.nivell = nivell(rec.ppm, rec.precisio);
  const top = Object.entries(failed).sort((a, b) => b[1] - a[1]).slice(0, 6);
  rec.fallades = top.map(([k, n]) => keyName(k) + "×" + n).join(" ");
  $("rn").textContent = nom;
  $("rl").textContent = "Nivell: " + rec.nivell;
  $("rv").textContent = rec.ppm; $("rp").textContent = rec.precisio + "%";
  const m = Math.floor(rec.temps / 60), s = rec.temps % 60;
  $("rt").textContent = m + ":" + String(s).padStart(2, "0");
  const rk = $("rk"); rk.textContent = "";
  if (!top.length) rk.textContent = "Cap error. Molt bé!";
  top.forEach(([k, n]) => {
    const d = document.createElement("div"); d.className = "k";
    d.textContent = keyName(k); const sm = document.createElement("small"); sm.textContent = n + (n > 1 ? " errors" : " error");
    d.appendChild(sm); rk.appendChild(d);
  });
  show("s-res"); send(rec);
}

async function send(rec) {
  $("msg").textContent = "Enviant la puntuació…";
  try { const l = JSON.parse(localStorage.getItem("meca-test") || "[]"); l.push(rec); localStorage.setItem("meca-test", JSON.stringify(l)); } catch (e) {}
  if (!SHEET_URL) { $("msg").textContent = "Puntuació guardada en aquest ordinador."; return; }
  try {
    await fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(rec) });
    $("msg").textContent = "Puntuació enviada a la taula.";
  } catch (e) { $("msg").textContent = "No s'ha pogut enviar. Avisa el professor."; }
}

async function openTable() {
  show("s-tab"); $("tb").textContent = "";
  try {
    if (SHEET_URL) { rows = await (await fetch(SHEET_URL)).json(); $("tmode").textContent = "Dades de la taula compartida."; }
    else { rows = JSON.parse(localStorage.getItem("meca-test") || "[]"); $("tmode").textContent = "Mode local: només es veuen els resultats fets en aquest navegador."; }
  } catch (e) { rows = []; $("tmode").textContent = "No s'ha pogut carregar la taula."; }
  rows.sort((a, b) => b.ppm - a.ppm);
  rows.forEach((r, i) => {
    const tr = document.createElement("tr");
    [i + 1, r.nom, r.ppm, r.precisio + "%", r.nivell, r.fallades, String(r.data).slice(0, 10)].forEach(v => {
      const td = document.createElement("td"); td.textContent = v; tr.appendChild(td);
    });
    $("tb").appendChild(tr);
  });
}
function csv() {
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const out = ["nom,ppm,precisio,nivell,fallades,temps,data", ...rows.map(r => [r.nom, r.ppm, r.precisio, r.nivell, r.fallades, r.temps, r.data].map(q).join(","))].join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + out], { type: "text/csv" })); a.download = "resultats-mecanografia.csv"; a.click();
}

$("go").onclick = begin;
$("nom").addEventListener("keydown", e => { if (e.key === "Enter") begin(); });
$("seeT").onclick = $("seeT2").onclick = openTable;
$("back").onclick = () => show("s-name");
$("again").onclick = () => { $("nom").value = ""; show("s-name"); $("nom").focus(); };
$("csv").onclick = csv;
</script>
</body>
</html>
