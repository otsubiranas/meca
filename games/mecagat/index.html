<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mecagat - Jocs de mecanografia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a3a6b;--cream:#fff4d6;--pink:#ff7aa8;--sky:#8fd3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#2b2150;font-family:'Press Start 2P',monospace;color:var(--cream)}
#wrap{position:relative;width:min(96vw,960px);aspect-ratio:16/9;border:6px solid var(--ink);border-radius:6px;box-shadow:0 8px 0 #1a1235;background:#000}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#ov{overflow:auto;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(43,33,80,.82);text-align:center;padding:16px}
#ov.hide{display:none}
#ov h1{font-size:clamp(18px,4vw,34px);margin:0;color:var(--pink);text-shadow:3px 3px 0 var(--ink)}
#ov p{font-size:clamp(8px,1.5vw,12px);line-height:1.8;margin:0;max-width:34em}
button{font:inherit;font-size:clamp(9px,1.6vw,13px);padding:10px 14px;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:4px;box-shadow:0 4px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#lv,.lv{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#lv button,.lv button{background:#b9a7e8;padding:8px 10px}
.lv button[disabled]{opacity:.4;cursor:not-allowed}
.lv.cv button{background:#5ee0d0;color:var(--ink)}
.lv.bc button{background:#ffd24d;color:var(--ink)}
.map{display:flex;align-items:flex-start;justify-content:center;flex-wrap:wrap;gap:6px;padding:12px;background:rgba(0,0,0,.25);border:3px solid var(--ink);border-radius:6px}
.nd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px}
.wb{width:48px;height:48px;font-size:20px;padding:0;color:var(--ink)}
.wb[disabled]{opacity:.5;background:#6b5b8a;color:#fff;cursor:default;box-shadow:0 4px 0 var(--ink)}
.nd small{font-size:7px;line-height:1.5;color:var(--cream)}
.nd .sc{color:#ffd24d}
.sec{background:#6b5b8a}
.bn{color:#ffd24d}
.wb.pop{animation:pop .9s}
.wb.shk{animation:shk .15s 6}
.nd .flash{animation:fl .8s 3}
@keyframes pop{0%{transform:scale(.6) rotate(-10deg)}40%{transform:scale(1.35) rotate(8deg);box-shadow:0 0 0 8px rgba(255,255,255,.7)}70%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes fl{50%{transform:scale(1.4)}}
@media (prefers-reduced-motion:reduce){.wb.pop,.wb.shk,.nd .flash{animation:none}}
.pt{width:20px;border-top:4px dotted #b9a7e8;margin-top:22px}
#kb{display:flex;flex-direction:column;align-items:center;gap:8px}
#kb .r{display:flex;gap:6px}
.k{width:clamp(26px,5vw,44px);height:clamp(26px,5vw,44px);display:grid;place-items:center;background:#b9a7e8;color:var(--ink);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);font-size:clamp(9px,1.8vw,15px)}
.k.on{background:var(--pink);color:#fff;transform:translateY(-4px)}
.k.bad{background:#ff5a5a}
a{color:var(--cream);font-size:10px}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>

const TOP='qwertyuiop';

const WN=[['La prada','🌿','#7bd16b'],['La cova','💎','#8f7be0'],['La platja','🐚','#ffd24d'],['Les ruïnes','🏛️','#e8e0c8'],["L'univers",'🪐','#7a6bff']];

function build(l){
  const L=LEVELS[l];let s=[];
  if(L.w){L.w.forEach(w=>s.push(...w))}
  else if(L.j){const rows=[TOP,ROW,BOT];let pr=-1;for(let i=0;i<L.len;i++){let q;do{q=Math.random()*3|0}while(q===pr);s.push(rows[q][Math.random()*rows[q].length|0]);pr=q}}

  return s;
}

function done(){
  st='done';const last=lv===LEVELS.length-1,home=lv%8===7,w=lv>>3;
  const acc=Math.round(100*hits/Math.max(1,hits+errs));
  runMs+=tEnd-t0;
  if(home){
    const b=best(w),nw=b==null||runMs<b;if(nw)saveBest(w,runMs);
    lastRun={ms:runMs,rec:nw};
    if(!last){try{localStorage.setItem('mecagat_w'+(w+2),'1')}catch(e){}}
  }
  show('<h1>'+(home?'Has arribat a casa!':'Nivell '+(lv%8+1)+' superat')+'</h1><p style="font-size:clamp(10px,2vw,16px);line-height:2">Temps: '+fmt(tEnd-t0)+'<br>Precisió: '+acc+'%</p>'+(last?'<p>Has completat els '+LEVELS.length+' nivells!</p>':'')+'<button id="nx">'+(home?'Veure el mapa':'Següent nivell')+'</button>');
  document.getElementById('nx').onclick=next;
  hint();
}
function next(){if(lv%8===7){const w=lv>>3;title({done:w,anim:w+1<NW?w+1:null})}else start(lv+1)}

addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(st==='cut'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();done();return}
  if(st==='done'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next();return}
  if(st==='title'&&e.key==='Enter'){start(latest()*8);return}
  if(st!=='play'||e.key.length!==1)return;
  e.preventDefault();
  const k=e.key.toLowerCase();
  if(k===seq[idx]){if(!t0)t0=performance.now();hits++;idx++;if(idx===seq.length){doorT=1;tEnd=performance.now()}hint()}
  else{errs++;red=8;shake=10;idx=Math.max(0,idx-1);hint()} // error: tornes una casella enrere
});

// pixel sprite
const CAT=["..d......d..",".dod....dod.",".dooooooood.","dooooooooood","dokoooookood","dooooppooood","dooooooooood",".dooooooood.",".dwwd..dwwd.","..dd....dd.."];
const PAL={d:'#4a3a6b',o:'#ffa94d',k:'#2b2150',p:'#ff7aa8',w:'#fff4d6'};
function sprite(m,x,y,s,o){for(let r=0;r<m.length;r++)for(let q=0;q<m[r].length;q++){const ch=m[r][q];if(ch!=='.'){g.fillStyle=(ch==='o'&&o)?o:PAL[ch];g.fillRect(x+q*s,y+r*s,s,s)}}}
const R=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x|0,y|0,w,h)};

const PL=[['#ff8a5c','#c8552c'],['#6ec6ff','#3578c0'],['#b58cff','#7a4cc8'],['#ffd24d','#c9962a'],['#7be0a0','#3fa56a'],['#ff7aa8','#c84a78']];
const PY=108,PH=38;
function disc(cx,cy,r,col){g.fillStyle=col;for(let d=-r;d<=r;d++){const w=Math.floor(Math.sqrt(r*r-d*d));g.fillRect(cx-w,cy+d,2*w,1)}}
function planet(i,x){
  const y=PY-hs[i]*PH,pc=PL[i%6],passed=i<idx,nx=i===idx;
  g.globalAlpha=passed?.45:1;
  if(i%4===1)R('#fff4d6',x-18,y,36,2);
  disc(x|0,y|0,11,pc[1]);disc((x-2)|0,(y-2)|0,9,pc[0]);R('rgba(255,255,255,.5)',(x-6)|0,(y-7)|0,4,2);
  if(i%4===1)R('#fff4d6',x-18,y+1,36,1);
  g.globalAlpha=1;
  if(!passed){
    g.font='10px "Press Start 2P",monospace';g.textAlign='center';
    const ly=(y+4-(nx?Math.abs(Math.sin(t*.12))*2:0))|0,L=seq[i].toUpperCase();
    g.fillStyle='#2b2150';g.fillText(L,x+1,ly+1);g.fillStyle=nx?(red>0?'#ff4d4d':'#fff'):'#fff4d6';g.fillText(L,x,ly);
    if(nx)R('#ffe36e',x-3,y-20,6,3);
  }
}
function sign(X,Y){R('#4a3a6b',X-10,Y-9,20,18);R('#fff',X-8,Y-7,16,14);g.font='10px "Press Start 2P",monospace';g.textAlign='center';g.fillStyle='#ff3d85';g.fillText(seq[seq.length-1].toUpperCase(),X,Y+4)}
const RB=['#ff2020','#ff9a00','#ffee00','#33ff00','#0099ff','#6633ff'];
function trail(camX,cy){
  const pts=[];for(let j=0;j<idx;j++)pts.push([camX+j*STEP,PY-(j>=1?hs[j-1]:0)*PH]);
  pts.push([CX,cy]);
  for(let q=0;q<pts.length-1;q++){
    let [x0,y0]=pts[q],[x1,y1]=pts[q+1];if(x1<x0){[x0,x1]=[x1,x0];[y0,y1]=[y1,y0]}
    if(x1<-10||x0>W+10)continue;
    for(let x=Math.max(-2,x0|0);x<=Math.min(W+2,x1|0);x++){
      const f=x1===x0?1:(x-x0)/(x1-x0),yc=y0+(y1-y0)*f+Math.round(Math.sin((x+t*2)/5)*1.5);
      for(let k=0;k<6;k++)R(RB[k],x,(yc+(k-3)*3)|0,1,3);
    }
  }
}
function nyan(x,y,fr){
  const u=2,o=(a,b,w,h,c)=>R(c,x+a*u,y+b*u,w*u,h*u),f=fr?1:0;
  o(0,5+f,3,2,'#222');o(0,6+f,2,1,'#aaa');
  o(2,1,12,10,'#222');o(3,2,10,8,'#ffd9a0');o(4,3,8,6,'#ff8fd8');
  o(5,4,1,1,'#ff3d85');o(8,5,1,1,'#ff3d85');o(10,4,1,1,'#ff3d85');o(6,7,1,1,'#ff3d85');o(9,8,1,1,'#ff3d85');
  o(11,3,9,8,'#222');o(12,4,7,6,'#aaa');o(12,1,2,3,'#222');o(17,1,2,3,'#222');
  o(13,6,1,1,'#222');o(17,6,1,1,'#222');o(12,8,2,1,'#ff9999');o(17,8,2,1,'#ff9999');o(14,8,3,1,'#222');
  o(3,11+f,2,2,'#222');o(7,11-f,2,2,'#222');o(13,11+f,2,2,'#222');o(17,11-f,2,2,'#222');
}
function toast(x,y){const u=2,o=(a,b,w,h,c)=>R(c,x+a*u,y+b*u,w*u,h*u);o(0,0,14,10,'#222');o(1,1,12,8,'#ffd9a0');o(2,2,10,6,'#ff8fd8');[[3,3],[6,4],[9,3],[5,6],[10,6]].forEach(p=>o(p[0],p[1],1,1,'#ff3d85'))}
function cutscene(cx){
  cutT++;const T=cutT,MX=cx+60,MY=GY-60;
  if(T<=70){
    const p=T/70,tx=MX+210*(1-p)*(1-p),ty=MY+Math.sin(T*.2)*3;
    toast((tx-14)|0,(ty-10)|0);sprite(CAT,cx-18,GY-30,3);
    if(T%3===0)R('#ffe36e',(tx+16+Math.random()*12)|0,(ty-8+Math.random()*16)|0,2,2);
  }else if(T<=118){
    const f=(T-70)/48,ccx=cx+(MX-cx)*f,ccy=(GY-15)+(MY-(GY-15))*f-Math.sin(f*Math.PI)*28;
    toast(MX-14,(MY+Math.sin(T*.2)*3-10)|0);sprite(CAT,(ccx-18)|0,(ccy-15)|0,3);
  }
  if(T>118&&T<=170){
    const r2=(T-118)*1.8;g.globalAlpha=Math.max(0,1-(T-118)/52);
    for(let k=0;k<12;k++){const a=k*.5236;R(k%2?'#ffe36e':'#fff',(MX+Math.cos(a)*r2)|0,(MY+Math.sin(a)*r2)|0,3,3)}
    g.globalAlpha=1;
  }
  if(T>=128){
    const f=Math.min(1,Math.max(0,(T-150)/160)),nx=MX+f*f*280,ny=MY-f*36+Math.sin(T*.15)*2;
    for(let xx=Math.max(0,(MX-30)|0);xx<=Math.min(W,(nx-14)|0);xx++){
      const ff=Math.sqrt(Math.max(0,(xx-MX)/280)),yy=MY-ff*36+Math.round(Math.sin((xx+T*2)/5)*1.5);
      for(let k=0;k<6;k++)R(RB[k],xx,(yy+(k-3)*3)|0,1,3);
    }
    nyan((nx-20)|0,(ny-13)|0,(T>>3)&1);
  }
  if(T>=150){
    g.globalAlpha=Math.min(1,(T-150)/20);g.font='8px "Press Start 2P",monospace';g.textAlign='center';
    g.fillStyle='#4a3a6b';g.fillText('Neix el Nyan Cat!',W/2+1,41);g.fillStyle='#fff4d6';g.fillText('Neix el Nyan Cat!',W/2,40);g.globalAlpha=1;
  }
  if(T>=118&&T<=140){g.globalAlpha=Math.max(0,1-Math.abs(T-128)/12);R('#fff',0,0,W,H);g.globalAlpha=1}
  if(T>=320)done();
}
function draw(){
  t++;const space=(lv>>3)===4,cave=(lv>>3)===1,beach=(lv>>3)===2,ruins=(lv>>3)===3;
  const camX=CX-dx*STEP; // el món es mou cap a l'esquerra: el gat avança cap a la dreta
  // sky bands
  (space?['#07051a','#0d0a2b','#140f3d','#1c1550']:cave?['#241a45','#2d2155','#352765','#3e2f75']:beach?['#6fd0ff','#8fdcff','#b0e8ff','#d4f3ff']:ruins?['#7ec8f0','#a6d8f5','#cfe8f5','#f5ecd0']:['#8fd3ff','#a8dcff','#c2e6ff','#dcf1ff']).forEach((col,i)=>R(col,0,i*38,W,40));
  if(!cave&&!space){R('#fff7c2',24,18,18,18);R('#ffe36e',28,22,10,10)}
  // clouds
  for(let i=0;!cave&&!space&&i<5;i++){const x=((i*90-dx*STEP*.15-t*.05)%(W+60)+W+60)%(W+60)-30,y=20+(i*23%50);R('#fff',x,y,26,8);R('#fff',x+6,y-5,14,6)}
  // hills
  for(let x=0;!beach&&!space&&x<W;x+=4){const h=34+14*Math.sin((x+dx*STEP*.4)/38)+8*Math.sin((x+dx*STEP*.4)/17);R(cave?'#3a2c68':ruins?'#d8d4b0':'#9ee08f',x,GY-h,4,h)}
  for(let x=0;!beach&&!space&&x<W;x+=4){const h=18+8*Math.sin((x+dx*STEP*.7)/25);R(cave?'#4b3a82':ruins?'#a9b87a':'#6fc765',x,GY-h,4,h)}
  if(cave){
    const sc=dx*STEP;
    for(let x=0;x<W;x+=4){const u=x+sc*.5,h=8+14*Math.abs(Math.sin(u/31))+6*Math.sin(u/9);R('#3a2c68',x,0,4,h)}
    for(let x=0;x<W;x+=4){const u=x+sc*.8,h=2+10*Math.abs(Math.sin(u/17+1));R('#15102b',x,0,4,h)}
    for(let i=0;i<7;i++){const x=((i*57-sc*.6)%(W+40)+W+40)%(W+40)-20,y=GY-4,col=i%2?'#5ee0d0':'#ff7aa8';R(col,x,y-10,4,10);R(col,x-3,y-5,3,5);R(col,x+4,y-7,3,7);R('#fff',x+1,y-9,1,3)}
    for(let i=0;i<14;i++){if((t+i*13)%60<30)R('#ffe36e',(i*47)%W,30+(i*37%90),1,1)}
  }
  if(beach){
    const sc=dx*STEP;R('#3aa7e0',0,GY-30,W,30);R('#2f90cc',0,GY-30,W,4);
    for(let k=0;k<3;k++)for(let x=0;x<W;x+=24){const xx=(((x+k*9-sc*.3+t*.2*(k+1))%W)+W)%W;R('#bfeaff',xx,GY-24+k*8,8,2)}
    for(let i=0;i<4;i++){const x=((i*95-sc*.6)%(W+60)+W+60)%(W+60)-30;R('#a0683a',x,GY-34,4,34);R('#6b4a2a',x+1,GY-34,3,3);R('#4fae5c',x-10,GY-38,24,4);R('#4fae5c',x-6,GY-42,16,4);R('#4fae5c',x-14,GY-34,8,3);R('#4fae5c',x+10,GY-34,8,3)}
  }
  if(ruins){
    const sc=dx*STEP;
    for(let i=0;i<3;i++){
      const x=((i*180-sc*.5)%(W+160)+W+160)%(W+160)-80;
      R('#cfc6a6',x-4,GY-4,88,4);R('#d9d0b0',x,GY-8,80,4);
      for(let k=0;k<6;k++){const hh=(i+k)%5===2?14:34,cx=x+4+k*13;R('#f2ead0',cx,GY-8-hh,5,hh);R('#cfc6a6',cx+3,GY-8-hh,2,hh)}
      R('#e8e0c8',x-2,GY-48,84,6);
      for(let q=0;q<6;q++)R('#f2ead0',x+q*6,GY-50-q*2,80-q*12,2);
    }
  }
  if(space){
    const sc=dx*STEP;
    g.globalAlpha=.16;
    for(let i=0;i<3;i++){const x=((i*140-sc*.2)%(W+120)+W+120)%(W+120)-60;disc(x|0,60+i*32,34,['#ff7aa8','#7a6bff','#5ee0d0'][i])}
    g.globalAlpha=1;
    for(let i=0;i<70;i++){const l=i%3,x=(((i*53)%W-sc*(.08+l*.12))%W+W)%W,y=(i*37)%150+14,tw=((t>>4)+i)%7===0;R(tw?'#fff':'#b9a7e8',x|0,y,l===2?2:1,l===2?2:1)}
    const bx=((250-sc*.25)%(W+80)+W+80)%(W+80)-40;disc(bx|0,50,16,'#3a2c68');disc((bx-3)|0,47,13,'#4b3a82');R('#8f7be0',(bx-26)|0,50,52,2);
  }
  // ground
  if(!space){
  R(cave?'#3a3060':beach?'#e8c87c':ruins?'#b9a67a':'#9a6b4a',0,GY,W,H-GY);R(cave?'#6a5a9a':beach?'#f6e2a8':ruins?'#e8dfc0':'#7bd16b',0,GY,W,6);R(cave?'#51437f':beach?'#ddb866':ruins?'#cbbf94':'#4fae5c',0,GY+6,W,2);
  for(let x=((camX%16)+16)%16-16;x<W;x+=16){R(cave?'#4a3d78':beach?'#d4b068':ruins?'#a8956a':'#b88259',x+4,GY+18,4,4);R(cave?'#4a3d78':beach?'#d4b068':ruins?'#a8956a':'#b88259',x+10,GY+30,4,4)}
  for(let x=((camX%24)+24)%24-24;x<W;x+=24){R(cave?'#5ee0d0':beach?'#ff7aa8':ruins?'#7a9a4a':'#4fae5c',x,GY-3,2,3);R(cave?'#5ee0d0':beach?'#ff7aa8':ruins?'#7a9a4a':'#4fae5c',x+3,GY-5,2,5)}
  }
  // stones & door
  for(let i=0;i<seq.length-1;i++){
    const x=camX+(i+1)*STEP;if(x<-40||x>W+40)continue;
    if(space){planet(i,x);continue}
    const off=hs[i]*28,top=GY-18-off,passed=i<idx;
    if(off)R('#8b6aa8',x-3,GY-off,6,off);
    R('#4a3a6b',x-14,top,28,18);R(passed?(cave?'#5ee0d0':beach?'#ffd24d':'#7bd16b'):'#b9a7e8',x-12,top+2,24,14);R('rgba(255,255,255,.35)',x-12,top+2,24,3);
    if(!passed){
      const nx=i===idx;
      g.font='10px "Press Start 2P",monospace';g.textAlign='center';
      g.fillStyle=nx?(red>0?'#ff4d4d':'#ff3d85'):'#4a3a6b';
      g.fillText(seq[i].toUpperCase(),x,(top+13-(nx?Math.abs(Math.sin(t*.12))*2:0))|0);
      if(nx)R('#ff7aa8',x-3,top-8,6,3);
    }
  }
  if(space){disc(camX|0,PY,11,'#2f8f86');disc((camX-2)|0,PY-2,9,'#5ee0d0')}else{R('#4a3a6b',camX-14,GY-18,28,18);R(cave?'#5ee0d0':beach?'#ffd24d':'#7bd16b',camX-12,GY-16,24,14)} // pedra d'inici
  const X=camX+seq.length*STEP,open=doorT>0&&dx>=seq.length-.1;
  if(space){
    if(X>-60&&X<W+130){
      const fin=lv%8===7;
      if(fin){
        disc(X|0,PY,26,'#1f5fb8');disc((X-3)|0,PY-3,23,'#2f7fd8');
        R('#4fae5c',X-16,PY-14,12,8);R('#4fae5c',X-10,PY-8,8,10);R('#4fae5c',X+6,PY+4,12,8);R('#4fae5c',X+8,PY-14,8,6);
        R('rgba(255,255,255,.7)',X-14,PY+8,14,3);R('rgba(255,255,255,.7)',X+2,PY-18,12,3);
      }else{
        disc(X|0,PY,17,'#7a6bff');disc(X|0,PY,13,'#b58cff');disc(X|0,PY,9,'#1c1550');
        for(let q=0;q<8;q++){const a=t*.08+q*.78;R('#fff',(X+Math.cos(a)*15)|0,(PY+Math.sin(a)*15)|0,2,2)}
      }
      if(open){g.globalAlpha=.4;disc(X|0,PY,fin?32:22,'#fff');g.globalAlpha=1}else sign(X|0,PY);
      if(fin){const cols=['#c9c9d9','#fff4d6','#8a79b0'];
        for(let k=0;k<3;k++){const y=PY-14-Math.abs(Math.sin(t*(open?.2:.13)+k*1.7))*(open?12:7);sprite(CAT,X+40+k*26,y,2,cols[k])}}
    }
  }else if(lv%8===7){
    if(X>-80&&X<W+120){
      if(TOWER.complete)g.drawImage(TOWER,(X-22)|0,GY-102);
      if(open)R('#ffe36e',X-3,GY-16,7,13);
      else{
        R('#4a3a6b',X-10,GY-38,20,18);R('#fff',X-8,GY-36,16,14);
        g.font='10px "Press Start 2P",monospace';g.textAlign='center';g.fillStyle='#ff3d85';
        g.fillText(seq[seq.length-1].toUpperCase(),X,GY-25);
      }
      const cols=['#c9c9d9','#fff4d6','#8a79b0'];
      for(let k=0;k<3;k++){
        const y=GY-20-Math.abs(Math.sin(t*(open?.2:.13)+k*1.7))*(open?12:7);
        sprite(CAT,X+38+k*26,y,2,cols[k]);
      }
    }
  }else if(X>-40&&X<W+40){
    R('#4a3a6b',X-16,GY-50,32,50);R('#c98a5a',X-13,GY-47,26,47);
    R(open?'#2b2150':'#d9a273',X-10,GY-44,20,44);
    if(open)R('#ffe36e',X-10,GY-44,20,3);
    else{
      R('#4a3a6b',X-8,GY-36,16,16);R('#fff4d6',X-6,GY-34,12,12);
      g.font='10px "Press Start 2P",monospace';g.textAlign='center';g.fillStyle='#ff3d85';
      g.fillText(seq[seq.length-1].toUpperCase(),X,GY-24);
      R('#ffe36e',X+8,GY-14,3,3);
    }
    R('#ff7aa8',X-6,GY-62,12,6);
  }
  // cat
  dx+=(idx-dx)*.28;if(Math.abs(idx-dx)<.01)dx=idx;
  const tgt=idx>0?hs[idx-1]:0;dh+=(tgt-dh)*.28;
  const mv=Math.min(1,Math.abs(idx-dx)),hop=mv*10*Math.abs(Math.sin(mv*Math.PI));
  const sh=shake>0?(shake%2?2:-2):0,base=GY-18-dh*28;
  const atDoor=doorT>0&&dx>=seq.length-.1,cutLv=lv===31;
  if(atDoor)doorT++;

  const idle=mv<.05?(Math.sin(t*.1)>0?0:1):0,cx=CX;

    R('#ffa94d',cx-19+sh,base-13-hop-idle,2,8);

  if(atDoor&&doorT>34&&st==='play'){if(cutLv){st='cut';cutT=0}else done()}
  if(red>0){red--}

  g.font='7px "Press Start 2P",monospace';g.textAlign='left';g.fillStyle='#fff4d6';

  g.textAlign='right';g.fillText('Temps '+fmt(t0?(tEnd||performance.now())-t0:0),W-4,10);

}
document.fonts.load('10px "Press Start 2P"').finally(()=>{seq=build(0);title();draw()});
