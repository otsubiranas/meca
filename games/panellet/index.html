<!DOCTYPE html>
<html lang="ca"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fes el teu panellet</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--fg:#4a2c17;--card:#fffaf0;--ac:#c9772b;--sky:#f6e3c3;--floor:#8a5a35;--bad:#c0392b;--ok:#2e8b57;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241811;--fg:#f5e3c8;--card:#33231a;--ac:#e8913f;--sky:#3b2a1d;--floor:#6e4a2d}}
:root[data-theme="dark"]{--bg:#241811;--fg:#f5e3c8;--card:#33231a;--ac:#e8913f;--sky:#3b2a1d;--floor:#6e4a2d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Press Start 2P","Courier New",monospace;font-size:11px;line-height:1.6;padding:12px}
h1{font-size:clamp(14px,3.5vw,22px);margin:4px 0 10px;display:flex;gap:12px;align-items:center;justify-content:center}
h1 img{height:44px;image-rendering:auto}
.wrap{display:flex;gap:12px;max-width:960px;margin:0 auto;flex-wrap:wrap}
#field{position:relative;flex:1 1 420px;height:min(60vh,520px);min-height:340px;overflow:hidden;background:linear-gradient(var(--sky),var(--bg));border:4px solid var(--fg);border-radius:6px}
#field:after{content:"";position:absolute;left:0;right:0;bottom:0;height:14px;background:var(--floor)}
#side{flex:0 0 230px;display:flex;flex-direction:column;gap:10px;margin:0 auto}
.card{background:var(--card);border:4px solid var(--fg);border-radius:6px;padding:10px;text-align:center}
#stage{height:150px;display:flex;align-items:center;justify-content:center}
#stage img{max-width:100%;max-height:150px;transition:transform .2s}
#stage img.ghost{opacity:.18;filter:grayscale(1)}
#stage img.pop{transform:scale(1.15)}
#chk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
#chk img{width:100%;height:42px;object-fit:contain;opacity:.22;filter:grayscale(1);transition:.2s}
#chk img.on{opacity:1;filter:none}
.big{font-size:20px;color:var(--ac)}
.item{position:absolute;width:84px;text-align:center;will-change:transform}
.item img{width:72px;height:60px;object-fit:contain;display:block;margin:0 auto}
.lab{display:inline-block;margin-top:2px;background:var(--fg);color:var(--bg);padding:4px 7px;border-radius:4px;font-size:14px;min-width:30px}
.lab b{color:#ffd24a;font-weight:normal}
.item.lock .lab{outline:3px solid #ffd24a}
.item.got{animation:got .25s forwards}@keyframes got{to{transform:translate(var(--x),var(--y)) scale(1.5);opacity:0}}
#ov{position:absolute;inset:0;background:rgba(36,24,17,.82);color:#f5e3c8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;z-index:5}
#ov h2{font-size:16px;margin:0}
button{font:inherit;font-size:12px;background:var(--ac);color:#fff;border:3px solid var(--fg);border-radius:6px;padding:10px 14px;cursor:pointer}
button:hover{filter:brightness(1.1)}
#inp{position:absolute;opacity:0;left:0;top:0;width:1px;height:1px}
.hearts{font-size:18px;letter-spacing:3px}
#pile{display:flex;flex-wrap:wrap-reverse;justify-content:center;min-height:44px;margin-bottom:8px}
#pile img{width:34px;margin:0 -3px -7px}
#kb{display:flex;gap:6px;justify-content:center;margin:12px auto 0;max-width:960px}
#kb span{width:min(9vw,48px);height:min(9vw,48px);display:flex;align-items:center;justify-content:center;background:var(--card);border:3px solid var(--fg);border-bottom-width:6px;border-radius:6px;font-size:16px}
#kb span.p{background:var(--ac);color:#fff;transform:translateY(3px);border-bottom-width:3px}
</style></head><body>

const ING=[['farina','Farina'],['moniato','Moniato'],['sucre','Sucre'],['ou','Ou'],['ametlla','Ametlla'],['pinyons','Pinyons']];
const $=id=>document.getElementById(id),F=$('field'),OV=$('ov'),INP=$('inp');
$('logo').src=D.logo;
$('chk').innerHTML=ING.map(([k,n])=>`<img id="c_${k}" src="${D[k]}" alt="${n}" title="${n}">`).join('');
let np=1,cur=0,scores=[0,0],best=0,run=false,items=[],lock=null,got=new Set(),misses=0,t0=0,last=0,nextSp=0,showDone=false,uid=0;
try{best=+localStorage.getItem('panellets_best')||0}catch(e){}
$('best').textContent=best;
function menu(){run=false;OV.style.display='flex';OV.innerHTML=`<h2>🥮 Fes el teu panellet</h2><div style="max-width:420px">Si culls tots els ingredients faràs un panellet! Qui té més ingredients guanya!</div><button onclick="start(1)">Jugar</button>`}
function start(n){np=n;cur=0;scores=[0,0];turn()}
function turn(){items.forEach(i=>i.el.remove());items=[];lock=null;got=new Set();misses=0;showDone=false;t0=last=performance.now();nextSp=0;run=true;
 OV.style.display='none';INP.focus();ui();requestAnimationFrame(loop)}
function ui(){$('score').textContent=scores[cur];$('pile').innerHTML=`<img src="${D.logo}" alt="">`.repeat(scores[cur]);$('hearts').textContent='❤'.repeat(3-misses)+'🖤'.repeat(misses);
 ING.forEach(([k])=>$('c_'+k).classList.toggle('on',got.has(k)));
 const c=got.size,s=showDone?3:c==0?-1:c<=2?0:c<=4?1:c==5?2:3;
 $('stage').innerHTML=s<0?`<img class="ghost" src="${D.stages[3]}" alt="">`:`<img class="${showDone?'pop':''}" src="${D.stages[s]}" alt="Panellet">`}
function spawn(el_){const t=(performance.now()-t0)/1000,miss=ING.filter(([k])=>!got.has(k));
 const pool=miss.length&&Math.random()<.65?miss:ING,[k]=pool[Math.random()*pool.length|0];
 const used=items.map(i=>i.lab[0]),A='asdfghjklñ',r=()=>A[Math.random()*A.length|0];
 let a,g=0;do{a=r()}while(used.includes(a)&&++g<50);
 const lab=Math.random()<Math.min(.2+t/120,.7)?a+r():a,l=lab;
 const el=document.createElement('div');el.className='item';el.innerHTML=`<img src="${D[k]}" alt=""><span class="lab">${lab}</span>`;
 F.appendChild(el);const it={id:uid++,k,lab:l,txt:lab,pos:0,el,x:Math.random()*(F.clientWidth-90)+3,y:-90,v:50+Math.min(t*1.3,130)+Math.random()*20};items.push(it);draw(it)}
function draw(i){i.el.style.transform=`translate(${i.x}px,${i.y}px)`;i.el.firstChild.nextSibling.innerHTML=`<b>${i.txt.slice(0,i.pos)}</b>${i.txt.slice(i.pos)}`;i.el.classList.toggle('lock',i===lock)}
function loop(n){if(!run)return;const dt=Math.min((n-last)/1000,.05);last=n;const t=(n-t0)/1000;
 if(t>=nextSp){spawn();nextSp=t+Math.max(.9,2.3-t*.016)}
 const H=F.clientHeight-70;
 for(const i of [...items]){i.y+=i.v*dt;if(i.y>=H){rm(i);if(lock===i)lock=null;misses++;ui();F.animate([{background:'#c0392b55'},{}],250);if(misses>=3){return over()}}else draw(i)}
 requestAnimationFrame(loop)}
function rm(i){items=items.filter(x=>x!==i);i.el.remove()}
function collect(i){rm(i);lock=null;got.add(i.k);
 if(got.size==6){scores[cur]++;showDone=true;ui();setTimeout(()=>{showDone=false;got.clear();ui()},900);got=new Set(ING.map(x=>x[0]));setTimeout(()=>{},0)}else ui()}
function key(c){if(!run||!/[a-zñ]/.test(c))return;
 if(lock){if(lock.lab[lock.pos]==c){lock.pos++;if(lock.pos>=lock.lab.length)return collect(lock);return draw(lock)}
  const o=lock;lock=null;o.pos=0;draw(o)}
 const m=items.filter(i=>i.lab[0]==c).sort((a,b)=>b.y-a.y)[0];if(!m)return;
 if(m.lab.length==1)return collect(m);lock=m;m.pos=1;draw(m)}
document.querySelector('.wrap').insertAdjacentHTML('afterend','<div id="kb">'+[...'asdfghjklñ'].map(c=>`<span id="k_${c}">${c}</span>`).join('')+'</div>');
function flash(c){const e=$('k_'+c);if(!e)return;e.classList.add('p');setTimeout(()=>e.classList.remove('p'),120)}
INP.addEventListener('input',()=>{[...INP.value.toLowerCase()].forEach(c=>{key(c);flash(c)});INP.value=''});
document.addEventListener('click',()=>{if(run)INP.focus()});
function over(){run=false;ui();OV.style.display='flex';const s=scores[cur];
 if(s>best){best=s;$('best').textContent=s;try{localStorage.setItem('panellets_best',s)}catch(e){}}
 
 let r=`<h2>Eliminat!</h2>`;
 r+=`<div>Has fet ${s} panellets 🥮</div>`;
 OV.innerHTML=r+`<button onclick="start(${np})">Tornar a jugar</button><button onclick="menu()">Menú</button>`}
menu();ui();
</script></body></html>
