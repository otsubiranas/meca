<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meca Fighter</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--u:min(1vw,1.7778vh);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07070d;overflow:hidden;color:#fff;
  font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace}
#game{position:absolute;left:50%;top:50%;width:calc(var(--u)*100);height:calc(var(--u)*56.25);
  transform:translate(-50%,-50%);overflow:hidden;background:#1a1030;user-select:none}

/* ---------- escenari ---------- */
#stage{position:absolute;inset:0}
#stage svg{width:100%;height:100%;display:block}

/* ---------- HUD ---------- */
#hud{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(var(--u)*2);height:calc(var(--u)*10);display:flex;justify-content:space-between;align-items:flex-start}
.hside{width:calc(var(--u)*39)}
.hname{font-size:calc(var(--u)*1.5);margin-bottom:calc(var(--u)*.8);display:flex;justify-content:space-between;text-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 #000}
.hside.right .hname{flex-direction:row-reverse}
.bar{position:relative;height:calc(var(--u)*3.2);background:#220;border:calc(var(--u)*.4) solid #fff;box-shadow:0 0 0 calc(var(--u)*.3) #000;overflow:hidden}
.bar .lag,.bar .fill{position:absolute;top:0;bottom:0}
.hside.left .bar div{left:0}
.hside.right .bar div{right:0}
.bar .lag{background:#e33;transition:width .8s ease .35s;width:100%}
.bar .fill{transition:width .15s linear,background .2s;width:100%;background:hsl(120,80%,48%)}
.pips{margin-top:calc(var(--u)*.9);font-size:calc(var(--u)*1.6);color:#ffd23f;letter-spacing:calc(var(--u)*.4)}
.hside.right .pips{text-align:right}
#center{width:calc(var(--u)*14);text-align:center;font-size:calc(var(--u)*1.4);padding-top:calc(var(--u)*.4);line-height:1.6;color:#ffd23f;text-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 #000}

/* ---------- lluitadors ---------- */
.fighter{position:absolute;top:calc(var(--u)*14.5);width:calc(var(--u)*18);height:calc(var(--u)*28.8);
  transition:left 1.2s cubic-bezier(.5,0,.3,1);--dir:1}
.fighter .flip{width:100%;height:100%;transform-origin:50% 100%;position:relative}
.fighter.right .flip{transform:scaleX(-1)}
.spr{position:absolute;left:calc(var(--u)*-1.96);top:calc(var(--u)*1.3);width:calc(var(--u)*24.55);height:calc(var(--u)*26.18);
  image-rendering:pixelated;animation:bob 1s steps(1) infinite}
.shadow{position:absolute;left:calc(var(--u)*2.9);top:calc(var(--u)*26.1);width:calc(var(--u)*11.1);height:calc(var(--u)*1.3);border-radius:50%;background:rgba(0,0,0,.4)}
.fighter.right .shadow{left:calc(var(--u)*4)}
.tag{position:absolute;left:0;right:0;top:calc(var(--u)*-1.7);text-align:center;font-size:calc(var(--u)*1.1);
  animation:tag .8s ease-in-out infinite alternate;text-shadow:calc(var(--u)*.15) calc(var(--u)*.15) 0 #000}
.p1 .tag{color:#ff5a47}.p2 .tag{color:#5aa2ff}
@keyframes tag{to{transform:translateY(calc(var(--u)*.5))}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-.33))}}

/* poses dels personatges: només es mostra el grup de la pose actual */
.pg{display:none}
[data-pose=idle] .p-idle,[data-pose=punch] .p-punch,[data-pose=kick] .p-kick,
[data-pose=win] .p-win,[data-pose=ko] .p-ko{display:inline}
.o{stroke:#1b1020;stroke-width:1.5;stroke-linejoin:round}
.sw{transform-box:fill-box;transform-origin:100% 50%;animation:sw .7s ease-in-out infinite alternate}
@keyframes sw{to{transform:rotate(-7deg)}}
.fx{transform-box:fill-box;transform-origin:center;animation:fx .32s ease-out forwards}
@keyframes fx{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.5)}}

.fighter.lunge{animation:lunge .32s ease-out}
@keyframes lunge{0%{transform:translateX(0)}40%{transform:translateX(calc(var(--u)*9*var(--dir)))}100%{transform:translateX(0)}}
.fighter.hurt .flip{animation:hurt .38s linear}
@keyframes hurt{0%,100%{filter:none;translate:0}20%{filter:brightness(2.6) saturate(.2);translate:calc(var(--u)*-1.5)}
  40%{translate:calc(var(--u)*1.2)}60%{filter:brightness(1.8);translate:calc(var(--u)*-.8)}80%{translate:calc(var(--u)*.5)}}
.fighter.ko .flip{transition:transform 1s ease-in;transform:rotate(-88deg) translateX(calc(var(--u)*-3));}
.fighter.right.ko .flip{transform:scaleX(-1) rotate(-88deg) translateX(calc(var(--u)*-3));}
.fighter.ko .spr{animation:none}
.fighter.win .spr{animation:win .5s steps(1) infinite}
@keyframes win{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-2.6))}}
.pop{position:absolute;font-size:calc(var(--u)*2.6);color:#fff;text-shadow:calc(var(--u)*.25) calc(var(--u)*.25) 0 #c00,0 0 calc(var(--u)*1) #ff0;
  animation:pop .9s ease-out forwards;pointer-events:none;z-index:6}
@keyframes pop{0%{transform:translateY(0) scale(.6);opacity:1}30%{transform:translateY(calc(var(--u)*-2)) scale(1.3)}100%{transform:translateY(calc(var(--u)*-6)) scale(1);opacity:0}}

/* ---------- panells de combinacions ---------- */
.panel{position:absolute;top:calc(var(--u)*43.5);width:calc(var(--u)*46);height:calc(var(--u)*11.5);
  background:rgba(8,6,20,.82);border:calc(var(--u)*.4) solid #fff;padding:calc(var(--u)*1) calc(var(--u)*1.4);
  display:flex;flex-direction:column;justify-content:space-between}
.panel.left{left:calc(var(--u)*2)}
.panel.right{right:calc(var(--u)*2)}
.panel.wrong{animation:wrong .4s}
@keyframes wrong{0%,100%{translate:0;border-color:#fff}15%,55%{translate:calc(var(--u)*-1);border-color:#f33;background:rgba(90,0,0,.85)}35%,75%{translate:calc(var(--u)*1);border-color:#f33}}
.ptitle{font-size:calc(var(--u)*1);display:flex;justify-content:space-between;color:#bbb}
.combo{display:flex;gap:calc(var(--u)*.5);justify-content:center}
.key{width:calc(var(--u)*4.8);height:calc(var(--u)*4.8);line-height:calc(var(--u)*4.8);text-align:center;
  font-size:calc(var(--u)*2.2);background:#eee;color:#111;border-radius:calc(var(--u)*.7);
  border-bottom:calc(var(--u)*.6) solid #888;text-transform:uppercase}
.key.done{background:#3ddc6b;border-bottom-color:#1c8a3d;color:#032;transform:translateY(calc(var(--u)*.4))}
.key.cur{background:#ffd23f;border-bottom-color:#b08a00;animation:cur .5s ease-in-out infinite alternate}
@keyframes cur{to{transform:translateY(calc(var(--u)*-.4))}}
.pkeys{font-size:calc(var(--u)*.85);color:#888;text-align:center;letter-spacing:calc(var(--u)*.1)}

/* ---------- banner i pantalles ---------- */
#banner{position:absolute;left:0;right:0;top:calc(var(--u)*17);text-align:center;font-size:calc(var(--u)*7);color:#ffd23f;
  text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #c0392b,calc(var(--u)*-.2) calc(var(--u)*-.2) 0 #fff;opacity:0;pointer-events:none;z-index:5}
#banner.show{animation:banner .55s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes banner{0%{transform:scale(3);opacity:0}100%{transform:scale(1);opacity:1}}
#overlay{position:absolute;inset:0;background:rgba(5,3,15,.88);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;z-index:10;padding:calc(var(--u)*3)}
#overlay.hidden{display:none}
#overlay h1{font-size:calc(var(--u)*6.2);color:#ffd23f;text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #c0392b;margin-bottom:calc(var(--u)*3)}
#overlay h2{font-size:calc(var(--u)*3.4);margin-bottom:calc(var(--u)*2.5);color:#ffd23f;line-height:1.4}
#overlay h2.st{font-size:calc(var(--u)*2.6);margin-bottom:calc(var(--u)*3)}
#overlay p{font-size:calc(var(--u)*1.35);line-height:2.1;max-width:calc(var(--u)*80);color:#ddd}
#overlay .kb{display:flex;gap:calc(var(--u)*6);margin:calc(var(--u)*2.5) 0}
#overlay .kb div{border:calc(var(--u)*.3) solid #fff;padding:calc(var(--u)*1.5) calc(var(--u)*2);font-size:calc(var(--u)*1.2);line-height:2.2}
#overlay .kb b{display:block;font-size:calc(var(--u)*1.5)}
.red{color:#ff5a47}.blue{color:#5aa2ff}
.blink{animation:blink 1s steps(2) infinite;color:#ffd23f;margin-top:calc(var(--u)*3);font-size:calc(var(--u)*1.8)}
@keyframes blink{50%{opacity:0}}

/* ---------- selecció de personatge ---------- */
.cards{display:flex;gap:calc(var(--u)*2.2)}
.card{position:relative;width:calc(var(--u)*19);padding:calc(var(--u)*2) calc(var(--u)*1) calc(var(--u)*1.4);
  border:calc(var(--u)*.4) solid #4a3d66;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center}
.card .portrait{width:calc(var(--u)*15);height:calc(var(--u)*16);image-rendering:pixelated;animation:bob 1s steps(1) infinite}
.cname{font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*1.3)}
.cdesc{font-size:calc(var(--u)*.9);color:#9a8fb5;margin-top:calc(var(--u)*.8)}
.card.c1{border-color:#ff5a47;background:rgba(255,90,71,.12)}
.card.c2{border-color:#5aa2ff;background:rgba(90,162,255,.12)}
.card.c1.c2{border-color:#ffd23f}
.mark{position:absolute;top:calc(var(--u)*-1.3);font-size:calc(var(--u)*1);padding:calc(var(--u)*.5) calc(var(--u)*.7);color:#000}
.m1{left:calc(var(--u)*-.4);background:#ff5a47}
.m2{right:calc(var(--u)*-.4);background:#5aa2ff}
.help{margin-top:calc(var(--u)*2.5);font-size:calc(var(--u)*1.05)!important;line-height:2.4!important}
.small{font-size:calc(var(--u)*1)!important;margin-top:calc(var(--u)*1.5)}
.names{display:flex;gap:calc(var(--u)*4);margin-bottom:calc(var(--u)*1)}
.nbox{width:calc(var(--u)*34);padding:calc(var(--u)*2);border:calc(var(--u)*.4) solid #4a3d66;background:rgba(255,255,255,.04);text-align:left}
.nbox.act{border-color:#ffd23f;background:rgba(255,210,63,.08)}
.nbox b{display:block;font-size:calc(var(--u)*1.3);margin-bottom:calc(var(--u)*1.8)}
.nval{font-size:calc(var(--u)*2.6);min-height:calc(var(--u)*3.6);letter-spacing:calc(var(--u)*.2);word-break:break-all}
.ncur{color:#ffd23f;animation:blink 1s steps(2) infinite}
.sprev{width:calc(var(--u)*17);height:calc(var(--u)*9.56);overflow:hidden;border:calc(var(--u)*.3) solid #000}
.sprev canvas,#stage canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.pip{display:inline-block;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);border:calc(var(--u)*.3) solid #ffd23f;margin-right:calc(var(--u)*.6)}
.pip.on{background:#ffd23f}
.hside.right .pip{margin:0 0 0 calc(var(--u)*.6)}
#sub{position:absolute;left:0;right:0;top:calc(var(--u)*27);text-align:center;font-size:calc(var(--u)*2.2);color:#fff;
  text-shadow:calc(var(--u)*.25) calc(var(--u)*.25) 0 #000;opacity:0;pointer-events:none;z-index:5}
#sub.show{opacity:1}

/* ---------- intro èpica ---------- */
.mc{width:calc(var(--u)*7);height:calc(var(--u)*7.47);image-rendering:pixelated}
.row{display:flex;gap:calc(var(--u)*3);margin:calc(var(--u)*1) 0 calc(var(--u)*1.5)}
.flash,.run{display:none}
#overlay.epic{overflow:hidden}
.epic .flash{display:block;position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;animation:flash .6s ease-out 1.15s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.epic .run{display:block;position:absolute;bottom:calc(var(--u)*14);width:calc(var(--u)*24.55);height:calc(var(--u)*26.18);image-rendering:pixelated;opacity:0}
.epic .runL{left:calc(var(--u)*-30);animation:runL 1s cubic-bezier(.5,0,.9,.6) .2s forwards}
.epic .runR{right:calc(var(--u)*-30);animation:runR 1s cubic-bezier(.5,0,.9,.6) .2s forwards}
@keyframes runL{0%{opacity:1;transform:translateX(0)}90%{opacity:1;transform:translateX(calc(var(--u)*58))}100%{opacity:0;transform:translateX(calc(var(--u)*58))}}
@keyframes runR{0%{opacity:1;transform:scaleX(-1) translateX(0)}90%{opacity:1;transform:scaleX(-1) translateX(calc(var(--u)*58))}100%{opacity:0;transform:scaleX(-1) translateX(calc(var(--u)*58))}}
.epic .shake{animation:shake .35s linear 1.2s,shake .35s linear 1.6s}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(calc(var(--u)*-1),calc(var(--u)*.6))}40%{transform:translate(calc(var(--u)*1),calc(var(--u)*-.6))}60%{transform:translate(calc(var(--u)*-.6),calc(var(--u)*-.4))}80%{transform:translate(calc(var(--u)*.6),calc(var(--u)*.4))}}
.epic .t1,.epic .t2{display:inline-block;opacity:0}
.epic .t1{animation:slam .5s cubic-bezier(.2,1.5,.4,1) 1.2s forwards}
.epic .t2{animation:slam .5s cubic-bezier(.2,1.5,.4,1) 1.6s forwards}
@keyframes slam{0%{opacity:0;transform:scale(5) translateY(calc(var(--u)*-5))}60%{opacity:1}100%{opacity:1;transform:scale(1)}}
.epic .ttl{animation:glow 1s ease-in-out 2.3s infinite alternate}
@keyframes glow{to{text-shadow:calc(var(--u)*.6) calc(var(--u)*.6) 0 #c0392b,0 0 calc(var(--u)*3) #ffd23f}}
.epic .mc{opacity:0;animation:rise .4s steps(4) forwards}
.epic .late{opacity:0;animation:rise .5s ease-out 3.2s forwards}
@keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*3))}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.epic .run,.epic .flash{display:none}.epic .shake,.epic .ttl{animation:none}.epic .t1,.epic .t2,.epic .mc,.epic .late{animation-duration:.01s;animation-delay:0s}}
</style>
</head>
<body>
<div id="game">
  <div id="stage"></div>

  <div id="hud">
    <div class="hside left"><div class="hname"><span id="nameL"></span></div>
      <div class="bar"><div class="lag" id="lagL"></div><div class="fill" id="fillL"></div></div>
      <div class="pips" id="pipsL"></div></div>
    <div id="center"><div id="roundLabel">RONDA 1</div></div>
    <div class="hside right"><div class="hname"><span id="nameR"></span></div>
      <div class="bar"><div class="lag" id="lagR"></div><div class="fill" id="fillR"></div></div>
      <div class="pips" id="pipsR"></div></div>
  </div>

  <div class="fighter p1" id="f1" data-pose="idle"><div class="tag">1P</div><div class="shadow"></div><div class="flip"></div></div>
  <div class="fighter p2" id="f2" data-pose="idle"><div class="tag">2P</div><div class="shadow"></div><div class="flip"></div></div>

  <div class="panel left" id="panelL"></div>
  <div class="panel right" id="panelR"></div>

  <div id="banner"></div>
  <div id="sub"></div>
  <div id="overlay"></div>
</div>

<script>
(function(){
'use strict';

/* ================== CONFIGURACIÓ ================== */
var LEFT  = 'qwertasdfgzxcvb';   // mà esquerra
var RIGHT = 'yuiophjklnm';       // mà dreta
var MAXHP = 100, START_LEN = 2, MAXLEN = 8, STUN_MS = 400;
var NAMES = { p1:'JUGADOR 1', p2:'JUGADOR 2' };

/* ================== UTILITATS ================== */
function $(s){ return document.querySelector(s); }
var game = $('#game');
var banner = $('#banner'), overlay = $('#overlay'), sub = $('#sub');
var els = { p1:$('#f1'), p2:$('#f2') };
var panels = { left:$('#panelL'), right:$('#panelR') };
var hud = {
  left :{ name:$('#nameL'), fill:$('#fillL'), lag:$('#lagL'), pips:$('#pipsL') },
  right:{ name:$('#nameR'), fill:$('#fillR'), lag:$('#lagR'), pips:$('#pipsR') }
};
function other(side){ return side==='left' ? 'right' : 'left'; }
function anim(elm, cls, ms){
  elm.classList.remove(cls); void elm.offsetWidth; elm.classList.add(cls);
  setTimeout(function(){ elm.classList.remove(cls); }, ms);
}

/* ================== PERSONATGES (SVG original, generats per codi) ================== */
var D = '#1b1020';
function P(p){ return p[0]+' '+p[1]; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
// cadena de segments amb contorn: primer tots els contorns, després tots els colors
function chain(parts){
  var o='', c='';
  parts.forEach(function(s){
    var d='M'+P(s[0])+' L'+P(s[1]);
    o+='<path d="'+d+'" stroke="'+D+'" stroke-width="'+(s[2]+3)+'" stroke-linecap="round" fill="none"/>';
    c+='<path d="'+d+'" stroke="'+s[3]+'" stroke-width="'+s[2]+'" stroke-linecap="round" fill="none"/>';
  });
  return o+c;
}
function arm(c,s,e,h){
  var fl='', pre='', wr='', f=h;
  if(c.cuff){ f=mix(e,h,c.cuff); pre=chain([[f,h,7,c.hand]]); }
  if(c.flap){
    var m=mix(e,f,.5);
    fl='<path class="o" d="M'+(m[0]-9)+' '+(m[1]+2)+' L'+(m[0]-8)+' '+(m[1]+28)+' Q'+m[0]+' '+(m[1]+34)+' '+(m[0]+10)+' '+(m[1]+27)+' L'+(m[0]+9)+' '+(m[1]+2)+'Z" fill="'+c.upC+'"/>'+
       '<circle cx="'+m[0]+'" cy="'+(m[1]+17)+'" r="2.6" fill="#ffd1df"/>';
  }
  if(c.wrist){
    var a=mix(e,h,.55), b=mix(e,h,.85);
    wr='<path d="M'+P(a)+' L'+P(b)+'" stroke="'+c.wrist+'" stroke-width="'+(c.fW+1.5)+'" fill="none"/>';
  }
  return pre+fl+chain([[s,e,c.upW,c.upC],[e,f,c.fW,c.fC]])+wr+
    (c.cuff?'':'<circle class="o" cx="'+h[0]+'" cy="'+h[1]+'" r="'+c.hr+'" fill="'+c.hand+'"/>');
}
function leg(c,h,k,f,rot){
  return chain([[h,k,15,c.pant],[k,f,12,c.shin]])+
    '<g transform="rotate('+(rot||0)+' '+f[0]+' '+f[1]+')"><rect class="o" x="'+(f[0]-9)+'" y="'+(f[1]-3)+'" width="26" height="10" rx="4" fill="'+c.shoe+'"/>'+
    (c.shoeTop?'<rect x="'+(f[0]+1)+'" y="'+(f[1]-2)+'" width="7" height="8" fill="'+c.shoeTop+'"/>':'')+'</g>';
}
function fx(h,dx){
  var x=h[0]+(dx||9), y=h[1];
  return '<g class="fx" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none">'+
    '<path d="M'+x+' '+(y-13)+' L'+(x+7)+' '+(y-19)+' M'+(x+3)+' '+y+' L'+(x+16)+' '+y+' M'+x+' '+(y+13)+' L'+(x+7)+' '+(y+19)+'"/>'+
    '<circle cx="'+(x+2)+'" cy="'+y+'" r="8" stroke="#ffd23f"/></g>';
}
function face(c,m){
  var s='';
  if(m==='n'){
    s+='<ellipse cx="60" cy="33" rx="3.6" ry="3.2" fill="#fff"/><circle cx="61.3" cy="33.4" r="1.9" fill="'+D+'"/>'+
       '<path d="M55 28.5 L66 30.5" stroke="'+D+'" stroke-width="2" stroke-linecap="round"/>'+
       (c.lash?'<path d="M56 31 L54.5 29.5 M64 30.5 L66.5 29.5" stroke="'+D+'" stroke-width="1.4" stroke-linecap="round"/>':'');
    if(!c.mask) s+='<path d="M58 41 L64 41.5" stroke="'+(c.lip||'#7a2d1d')+'" stroke-width="'+(c.lip?2.4:1.6)+'" stroke-linecap="round"/>';
  } else if(m==='w'){
    s+='<path d="M55.5 34.5 Q60 28 65 34.5" stroke="'+D+'" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
    if(!c.mask) s+='<path d="M57 39 Q62.5 47 68 38Z" fill="#8b1e1e" stroke="'+D+'" stroke-width="1"/>';
  } else {
    s+='<path d="M56 30 L64 37 M64 30 L56 37" stroke="'+D+'" stroke-width="2.2" stroke-linecap="round"/>';
    if(!c.mask) s+='<ellipse cx="62" cy="43" rx="3" ry="2.6" fill="#7a1f1f"/>';
  }
  if(!c.mask) s+='<path d="M66 35 L69 38.5 L65.5 39" stroke="rgba(90,50,20,.8)" stroke-width="1.2" fill="none" stroke-linejoin="round"/>';
  return s;
}
var POSE = {
  bI:[[38,62],[26,84],[46,74]], fI:[[62,62],[72,84],[90,68]], fP:[[62,62],[82,64],[104,62]],
  bW:[[38,62],[22,44],[20,22]], fW:[[62,62],[80,44],[84,22]],
  bK:[[38,62],[27,84],[25,106]], fK:[[62,62],[72,84],[70,106]]
};
function build(c){
  function A(k){ return arm(c,POSE[k][0],POSE[k][1],POSE[k][2]); }

/* ===== PIXEL ART: els SVG es rasteritzen a baixa resolució (estil Street Fighter) ===== */
var SW = 75, SH = 80, SS = 4;            // mida de l'sprite en píxels i supermostreig
var POSES = ['idle','punch','kick','win','ko'];
var sprites = [], cur = { p1:0, p2:3 };
function qz(v){ return Math.min(255, Math.round(v/32)*32); }   // paleta reduïda
function pixelate(img){
  var bw = SW*SS, bh = SH*SS;
  var big = document.createElement('canvas'); big.width = bw; big.height = bh;
  var bx = big.getContext('2d'); bx.drawImage(img, 0, 0, bw, bh);
  var src = bx.getImageData(0,0,bw,bh).data;
  var out = document.createElement('canvas'); out.width = SW; out.height = SH;
  var ox = out.getContext('2d'), im = ox.createImageData(SW,SH), d = im.data, n = SS*SS;
  var x, y, i, j, k, p;
  for(y=0;y<SH;y++) for(x=0;x<SW;x++){
    var r=0,g=0,b=0,a=0;
    for(j=0;j<SS;j++) for(i=0;i<SS;i++){
      k = ((y*SS+j)*bw + (x*SS+i))*4;
      var al = src[k+3];
      r += src[k]*al; g += src[k+1]*al; b += src[k+2]*al; a += al;
    }
    if(a/n >= 128){            // el píxel és opac o no (vores dures, sense suavitzat)
      p = (y*SW+x)*4;
      d[p]=qz(r/a); d[p+1]=qz(g/a); d[p+2]=qz(b/a); d[p+3]=255;
    }
  }
  var o = new Uint8ClampedArray(d);
  function op(x,y){ return x>=0 && y>=0 && x<SW && y<SH && o[(y*SW+x)*4+3]===255; }
  for(y=0;y<SH;y++) for(x=0;x<SW;x++){      // contorn exterior d'1 píxel
    if(!op(x,y) && (op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1))){
      p = (y*SW+x)*4; d[p]=30; d[p+1]=16; d[p+2]=34; d[p+3]=255;
    }
  }
  ox.putImageData(im,0,0);
  return out;
}
function loadSprites(done){
  var left = CH.length*POSES.length;
  function fin(){ if(--left===0) done(); }
  CH.forEach(function(c,ci){
    sprites[ci] = {};
    var base = c.svg.replace(/<ellipse cx="52" cy="155"[^>]*\/>/,'');
    POSES.forEach(function(pose){
      var svg = base.replace(/^<svg[^>]*>/,
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 0 150 160" width="'+(SW*SS)+'" height="'+(SH*SS)+'">'+
        '<style>.pg{display:none}.p-'+pose+'{display:inline}.o{stroke:#1b1020;stroke-width:2.2;stroke-linejoin:round}</style>');
      var img = new Image();
      img.onload = function(){ sprites[ci][pose] = pixelate(img); fin(); };
      img.onerror = fin;
      img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    });
  });
}
function paint(cv, ci, pose){
  if(!cv || !sprites[ci] || !sprites[ci][pose]) return;
  var cx = cv.getContext('2d'); cx.clearRect(0,0,SW,SH); cx.drawImage(sprites[ci][pose],0,0);
}
function setPose(o, p){ els[o].dataset.pose = p; paint(els[o].querySelector('canvas'), cur[o], p); }

  setPose(o, kind);
  setTimeout(function(){ if(els[o].dataset.pose===kind && state==='fight') setPose(o,'idle'); }, 300);
}

var actx = null;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(f, dur, type, vol, slideTo){
  if(!actx) return;
  var o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = type||'square'; o.frequency.setValueAtTime(f, t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
  g.gain.setValueAtTime(vol||.08, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur);
}
var sfx = {
  tick:function(){ beep(660,.05,'square',.05); },
  bad :function(){ beep(140,.25,'sawtooth',.09,70); },
  hit :function(len){ beep(220+len*30,.22,'square',.12,60); beep(90,.3,'sawtooth',.1,40); },
  ko  :function(){ beep(300,.9,'sawtooth',.14,40); },
  go  :function(){ beep(520,.25,'square',.1,880); },
  win :function(){ [523,659,784,1046].forEach(function(f,i){ setTimeout(function(){ beep(f,.2,'square',.09); }, i*140); }); }
};

function sideKeys(side){ return side==='left' ? LEFT : RIGHT; }
function rndCombo(side, len){
  var k = sideKeys(side), out = [], last = '';
  for(var i=0;i<len;i++){
    var c; do { c = k.charAt(Math.floor(Math.random()*k.length)); } while(c===last);
    out.push(c); last = c;
  }
  return out;
}
function groupKeys(side){
  return side==='left' ? 'Q W E R T · A S D F G · Z X C V B' : 'Y U I O P · H J K L · N M';
}
function newFighter(owner, side){

function renderPanel(side){
  var f = F[side], p = panels[side];
  if(!f){ p.innerHTML = ''; return; }
  var keys = '';
  for(var i=0;i<f.combo.length;i++){
    keys += '<span class="key'+(i<f.pos?' done':(i===f.pos?' cur':''))+'">'+f.combo[i]+'</span>';
  }
  p.innerHTML =
    '<div class="ptitle"><span class="'+(f.owner==='p1'?'red':'blue')+'">'+NAMES[f.owner]+'</span><span>COMBO x'+f.len+'</span></div>'+
    '<div class="combo">'+keys+'</div>';
}
function renderHud(){
  ['left','right'].forEach(function(side){
    var f = F[side], h = hud[side];
    if(!f) return;
    h.name.textContent = NAMES[f.owner];
    h.name.className = f.owner==='p1' ? 'red' : 'blue';
    var pct = Math.max(0, f.hp)/MAXHP*100;
    var vis = f.hp>0 ? Math.max(pct,6) : 0;     // si encara queda vida, la barra mai sembla buida
    h.fill.style.width = vis+'%';
    h.lag.style.width = vis+'%';
    h.fill.style.background = 'hsl('+(pct*1.2)+',80%,48%)';
    var w = wins[f.owner], s = '';
    for(var i=0;i<2;i++) s += '<i class="pip'+(i<w?' on':'')+'"></i>';
    h.pips.innerHTML = s;
  });
}

function selectKey(k){
  var o = null, act = null;
  if(k==='a'||k==='d'||k==='s'||k==='w'){ o='p1'; act={a:-1,d:1,s:'ok',w:'no'}[k]; }
  else if(k==='j'||k==='l'||k==='k'||k==='i'){ o='p2'; act={j:-1,l:1,k:'ok',i:'no'}[k]; }
  if(!o) return;
  var me = sel[o], ot = sel[o==='p1'?'p2':'p1'];
  if(act==='ok'){
    if(me.ok) return;
    if(ot.ok && ot.i===me.i){ sfx.bad(); return; }
    me.ok = true; sfx.go();
  } else if(act==='no'){
    if(!me.ok) return;
    me.ok = false; sfx.tick();
  } else {
    if(me.ok) return;
    me.i = (me.i + act + CH.length) % CH.length; sfx.tick();
  }
  drawSelect();
  if(sel.p1.ok && sel.p2.ok){
    setTimeout(function(){ if(state==='select' && sel.p1.ok && sel.p2.ok) stageScreen(); }, 700);
  }
}

/* ================== PANTALLA DE NOMS ================== */
var MAXNAME = 10;
var names = { p1:'JUGADOR 1', p2:'JUGADOR 2' };
var typed = { p1:'', p2:'' }, nameStep = 1;
function namesScreen(){
  state = 'names'; nameStep = 1;
  F.left = F.right = null; renderPanel('left'); renderPanel('right');
  drawNames();
}
function drawNames(){
  function box(o,n,cls){
    var act = nameStep===n;
    return '<div class="nbox'+(act?' act':'')+'"><b class="'+cls+'">JUGADOR '+n+'</b>'+
      '<div class="nval">'+typed[o]+(act?'<span class="ncur">_</span>':'')+'</div></div>';
  }
  setOverlay('<h2 class="st">QUI JUGA?</h2><div class="names">'+box('p1',1,'red')+box('p2',2,'blue')+'</div>'+
    '<p class="help">Escriu el teu nom i prem ENTER<br>(màxim '+MAXNAME+' lletres)</p>'+
    '<p class="small">ESC: TORNAR AL MENÚ</p>');
}
function nameKey(e){
  var o = nameStep===1 ? 'p1' : 'p2';
  if(e.key === 'Enter'){
    e.preventDefault();
    if(nameStep===1){ nameStep = 2; sfx.go(); drawNames(); } else finishNames();
    return;
  }
  if(e.key === 'Backspace'){
    e.preventDefault();
    if(typed[o]) typed[o] = typed[o].slice(0,-1); else if(nameStep===2) nameStep = 1;
    drawNames(); return;
  }
  if(e.code === 'Space'){ e.preventDefault(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key.length===1 && /[A-Za-z0-9\u00C0-\u00FF]/.test(e.key) && typed[o].length < MAXNAME){
    e.preventDefault(); typed[o] += e.key.toUpperCase(); sfx.tick(); drawNames();
  }
}
function finishNames(){
  names.p1 = typed.p1 || 'JUGADOR 1';
  names.p2 = typed.p2 || 'JUGADOR 2';
  sfx.go(); selectScreen();
}

/* ================== ESCENARIS ================== */
var STAGES = [ {k:'dojo',name:'DOJO'}, {k:'platja',name:'PLATJA'}, {k:'lluna',name:'LLUNA'}, {k:'ny',name:'NOVA YORK'} ];
var stageI = 0;
function rnd(seed){ var s = seed; return function(){ s = (s*16807)%2147483647; return s/2147483647; }; }
function R(x,y,w,h,f,o){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="'+f+'"'+(o?' opacity="'+o+'"':'')+'/>'; }
function Pg(pts,f){ return '<polygon points="'+pts+'" fill="'+f+'"/>'; }
function bands(y0,y1,cols){
  var s = '', st = (y1-y0)/cols.length;
  cols.forEach(function(c,i){ s += R(0, Math.round(y0+i*st), 160, Math.ceil(st)+1, c); });
  return s;
}
function city(r,list,col,lit){
  var s = '';
  list.forEach(function(b){
    s += R(b[0],b[2],b[1],56-b[2],col);
    for(var wy=b[2]+3; wy<53; wy+=4) for(var wx=b[0]+2; wx<b[0]+b[1]-2; wx+=4)
      if(r()<.42) s += R(wx,wy,2,2, r()<.8 ? lit[0] : lit[1]);
  });
  return s;
}
function stageSVG(k){
  var r = rnd(7+k.length*13), i, x, y,
      h = '<svg viewBox="0 0 160 90" preserveAspectRatio="none" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">';
  if(k==='dojo'){
    h += R(0,0,160,56,'#e0c08c');

    h += R(0,0,160,9,'#4a2e18')+R(0,9,160,2,'#2f1b0d')+R(0,0,7,56,'#5a3a1e')+R(153,0,7,56,'#5a3a1e')+R(0,52,160,4,'#5a3a1e');
    [13,103].forEach(function(x0){
      h += R(x0,15,48,34,'#5a3a1e')+R(x0+2,17,44,30,'#f6efd9')+R(x0+2,17,44,3,'#fffaf0');
      for(var gx=x0+13; gx<x0+46; gx+=11) h += R(gx,17,1,30,'#5a3a1e');
      for(var gy=27; gy<47; gy+=10) h += R(x0+2,gy,44,1,'#5a3a1e');
    });
    h += R(69,12,22,2,'#2f1b0d')+R(73,14,14,30,'#f6efd9')+R(69,44,22,2,'#2f1b0d')+
         '<circle cx="80" cy="24" r="4" fill="#c0392b"/>'+R(77,31,6,2,'#222')+R(79,33,2,9,'#222');
    [63,97].forEach(function(lx){
      h += R(lx+3,11,1,6,'#2f1b0d')+R(lx,17,7,9,'#d9442b')+R(lx,17,7,1,'#2f1b0d')+R(lx,25,7,1,'#2f1b0d')+R(lx+2,19,3,5,'#ffcf6b');
    });
    h += R(0,56,160,34,'#a8713e');
    var rows = [56,62,70,80,90];
    for(i=0;i<4;i++){
      if(i) h += R(0,rows[i],160,1,'#7d4f27');
      for(x=(i%2)*14; x<160; x+=28) h += R(x,rows[i],1,rows[i+1]-rows[i],'#7d4f27');
    }
  } else if(k==='platja'){
    h += bands(0,38,['#3fb4e6','#5bc3ea','#7cd1ee','#a2dcef','#ffe3a6','#ffcc84']);
    h += '<circle cx="118" cy="32" r="13" fill="#fff4b0" opacity=".35"/><circle cx="118" cy="32" r="8" fill="#fff4b0"/>';
    [[16,10],[54,16],[90,8],[132,18]].forEach(function(c){ h += R(c[0],c[1],18,3,'#fff')+R(c[0]+3,c[1]-2,10,2,'#fff')+R(c[0]+5,c[1]+3,12,1,'#d8eefa'); });
    h += bands(38,56,['#1b86c2','#2398d0','#2fa9dc']);
    for(i=0;i<16;i++) h += R(Math.floor(r()*150),40+Math.floor(r()*14),6,1,'#8fd8f2');
    h += R(60,38,12,2,'#7a4a26')+R(65,26,1,12,'#7a4a26')+Pg('66,27 66,37 73,37','#fff')+Pg('64,30 64,37 59,37','#f4f4f4');
    h += R(0,56,160,34,'#f3d98f')+R(0,56,160,3,'#d9bd78')+R(0,54,160,2,'#fff');
    for(x=0;x<160;x+=14) h += R(x,56,7,1,'#fff');
    for(i=0;i<70;i++) h += R(Math.floor(r()*158),60+Math.floor(r()*30),2,1, r()<.5?'#dcc17a':'#fff0bd');
    h += Pg('9,58 14,58 21,30 17,30','#8b5a2b')+Pg('12,58 14,58 21,30 19,30','#a8713e');
    h += Pg('19,30 3,25 8,32 -2,35 11,34','#2e9e4f')+Pg('19,30 36,24 31,32 43,34 28,35','#2e9e4f')+
         Pg('19,30 13,16 20,25 25,13 23,30','#3cb85f')+Pg('19,30 6,34 12,41 19,33','#25833f')+Pg('19,30 32,36 27,42 19,33','#25833f')+
         '<circle cx="17" cy="33" r="1.6" fill="#5a3a1e"/><circle cx="21" cy="33" r="1.6" fill="#5a3a1e"/>';
    h += R(139,38,2,30,'#e8e8e8')+Pg('124,43 140,31 156,43','#e53935')+Pg('134,41 140,33 146,41 140,43','#fff')+
         R(126,66,24,6,'#ff6b9a')+R(126,68,24,2,'#fff');
  } else if(k==='lluna'){
    h += R(0,0,160,56,'#05060f');
    for(i=0;i<70;i++) h += R(Math.floor(r()*158),Math.floor(r()*54),r()<.2?2:1,1, r()<.2?'#ffe9a8':'#fff');
    h += '<circle cx="122" cy="24" r="15" fill="#1f6fd1"/>'+Pg('114,18 122,14 128,20 124,26 116,28 112,23','#3da35d')+
         Pg('126,30 133,28 134,34 129,37','#3da35d')+R(112,31,10,2,'#fff',.8)+R(124,20,8,1,'#fff',.8)+
         '<path d="M137 24A15 15 0 0 1 122 39A19 15 0 0 0 137 24Z" fill="#000" opacity=".35"/>';
    h += Pg('0,56 10,46 22,50 34,40 50,52 62,46 80,56','#4b4e5c')+Pg('100,56 112,48 126,44 140,50 150,46 160,52 160,56','#4b4e5c')+
         Pg('34,40 38,44 32,46','#6b6e7e')+Pg('126,44 130,47 124,48','#6b6e7e');
    h += R(0,56,160,34,'#9a9aa6')+R(0,56,160,2,'#b9b9c4');
    [[30,70,14,3],[120,78,18,4],[80,84,10,2],[150,66,8,2],[60,62,6,1.5]].forEach(function(c){
      h += '<ellipse cx="'+c[0]+'" cy="'+c[1]+'" rx="'+c[2]+'" ry="'+c[3]+'" fill="#7c7c88"/>'+
           '<ellipse cx="'+c[0]+'" cy="'+(c[1]-.6)+'" rx="'+c[2]+'" ry="'+c[3]+'" fill="none" stroke="#c4c4ce" stroke-width=".8"/>';
    });
    for(i=0;i<80;i++) h += R(Math.floor(r()*158),59+Math.floor(r()*30),1,1, r()<.5?'#85858f':'#aeaeb8');
    h += R(12,38,14,10,'#d9b44a')+R(15,40,5,4,'#333')+R(19,34,1,4,'#ccc')+R(10,36,18,2,'#b89530')+
         '<path d="M12 48L6 56M26 48L32 56" stroke="#bbb" stroke-width="1.5"/>'+R(3,55,7,1.5,'#ddd')+R(28,55,7,1.5,'#ddd');
    h += R(146,38,1,18,'#ddd')+R(147,38,9,2,'#e53935')+R(147,40,9,2,'#fff')+R(147,42,9,2,'#e53935')+R(147,38,4,3,'#2a4fb0');
  } else {
    h += bands(0,56,['#0b1030','#151a48','#201f5a','#2f2468','#4a2c74','#7a3a7c']);
    for(i=0;i<40;i++) h += R(Math.floor(r()*158),Math.floor(r()*30),1,1,'#fff');
    h += '<circle cx="28" cy="15" r="6" fill="#fff4d0"/><circle cx="26" cy="13" r="1.5" fill="#e6dcb0"/>';
    h += city(r,[[0,14,32],[14,10,24],[24,16,36],[40,12,28],[52,14,38],[104,12,30],[116,14,22],[130,10,34],[140,20,28]],'#1a1f4d',['#8fa0ff','#cfd6ff']);
    h += R(70,34,20,22,'#0f1340')+R(73,26,14,8,'#0f1340')+R(76,18,8,8,'#0f1340')+R(78,12,4,6,'#0f1340')+R(79,3,2,9,'#0f1340')+R(79,2,2,2,'#ff4d4d');
    for(y=37;y<54;y+=4) for(x=72;x<89;x+=4) if(r()<.5) h += R(x,y,2,2,'#ffd86b');
    for(y=28;y<34;y+=4) for(x=75;x<86;x+=4) if(r()<.5) h += R(x,y,2,2,'#ffd86b');
    h += city(r,[[4,18,40],[22,12,46],[34,14,42],[48,12,47],[96,14,44],[110,12,48],[122,16,40],[138,22,46]],'#0a0d2a',['#ffd86b','#9fe3ff']);
    h += R(0,56,160,8,'#6e6e84')+R(0,56,160,2,'#9a9ab2');
    for(x=0;x<160;x+=12) h += R(x,58,1,6,'#5a5a70');
    h += R(0,64,160,26,'#2e2e3c')+R(0,64,160,1,'#1a1a24');
    for(x=2;x<160;x+=22) h += R(x,80,12,2,'#f3c623');
    h += R(132,68,26,8,'#f3c623')+R(137,63,15,5,'#f3c623')+R(139,64,5,4,'#9fd8ff')+R(146,64,5,4,'#9fd8ff')+
         R(143,61,4,2,'#fff')+R(132,71,26,1,'#111')+R(135,75,5,4,'#111')+R(150,75,5,4,'#111');
  }
  h += R(0,64,160,8,'#000',.1)+R(0,72,160,9,'#000',.2)+R(0,81,160,9,'#000',.3);
  return h+'</svg>';
}
/* Els escenaris també es rasteritzen: 320x180 px (el mateix tamany de píxel que els sprites) i paleta reduïda */
var stageImgs = {};
function loadStages(done){
  var left = STAGES.length;
  function fin(){ if(--left===0) done(); }
  STAGES.forEach(function(st){
    var svg = stageSVG(st.k).replace('<svg ','<svg width="320" height="180" ');
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas'); cv.width = 320; cv.height = 180;
      var cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false; cx.drawImage(img,0,0,320,180);
      var im = cx.getImageData(0,0,320,180), d = im.data;
      for(var i=0;i<d.length;i+=4){
        d[i]=Math.min(255,Math.round(d[i]/16)*16); d[i+1]=Math.min(255,Math.round(d[i+1]/16)*16);
        d[i+2]=Math.min(255,Math.round(d[i+2]/16)*16); d[i+3]=255;
      }
      cx.putImageData(im,0,0); stageImgs[st.k] = cv; fin();
    };
    img.onerror = fin;
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  });
}
function paintStage(cv,k){ if(cv && stageImgs[k]) cv.getContext('2d').drawImage(stageImgs[k],0,0); }
function applyStage(){
  var st = $('#stage');
  if(!st.firstChild) st.innerHTML = '<canvas width="320" height="180"></canvas>';
  paintStage(st.firstChild, STAGES[stageI].k);
}
function stageScreen(){ state = 'stage'; drawStage(); }
function drawStage(){
  var h = '<h2 class="st">TRIA L\'ESCENARI</h2><div class="cards">';
  STAGES.forEach(function(s,i){
    h += '<div class="card'+(i===stageI?' c1 c2':'')+'"><div class="sprev"><canvas class="sc" width="320" height="180" data-k="'+s.k+'"></canvas></div><div class="cname">'+s.name+'</div></div>';
  });
  h += '</div><p class="help">A D / J L moure · S / K triar · ESC enrere</p>';
  setOverlay(h);
  [].forEach.call(overlay.querySelectorAll('canvas.sc'), function(cv){ paintStage(cv, cv.dataset.k); });
}
function stageKey(k){
  if(k==='a'||k==='j') stageI = (stageI+STAGES.length-1)%STAGES.length;
  else if(k==='d'||k==='l') stageI = (stageI+1)%STAGES.length;
  else if(k==='s'||k==='k'){ chooseStage(); return; }
  else return;
  sfx.tick(); drawStage();
}
function chooseStage(){ sfx.go(); applyStage(); startMatch(); }

/* ================== FLUX DE LA PARTIDA ================== */
function startMatch(){
  initAudio();
  applyChars();
  wins = { p1:0, p2:0 };
  startRound(1);
}
function startRound(n){
  runId++; var id = runId;
  round = n;
  if(n===1) sideOf = { p1:'left', p2:'right' };
  else      sideOf = { p1:'right', p2:'left' };   // ronda 2 i desempat: costats canviats
  F.left  = newFighter(sideOf.p1==='left' ? 'p1' : 'p2', 'left');
  F.right = newFighter(sideOf.p1==='right' ? 'p1' : 'p2', 'right');
  placeFighters(); renderHud(); renderPanel('left'); renderPanel('right');
  $('#roundLabel').innerHTML = n===3 ? 'DESEMPAT' : 'RONDA<br>'+n;
  hideOverlay();
  state = 'intro';
  showBanner(n===3 ? 'DESEMPAT' : 'RONDA '+n);
  setTimeout(function(){
    if(id!==runId) return;
    showBanner('FIGHT!'); sfx.go(); state = 'fight';
    setTimeout(function(){ if(id===runId) hideBanner(); }, 800);
  }, 1700);
}

function press(side, k){
  var f = F[side], now = performance.now();
  if(!f || now < f.stun) return;
  if(k === f.combo[f.pos]){
    f.pos++; sfx.tick();
    if(f.pos >= f.len) hit(side); else renderPanel(side);
  } else {
    f.pos = 0; f.combo = rndCombo(side, f.len); f.stun = now + STUN_MS;
    renderPanel(side); anim(panels[side], 'wrong', 400); sfx.bad();
  }
}

function hit(side){
  var a = F[side], d = F[other(side)];
  var dmg = 5 + a.len*2;
  d.hp = Math.max(0, d.hp - dmg);
  sfx.hit(a.len);
  anim(els[a.owner], 'lunge', 320);
  anim(els[d.owner], 'hurt', 380);
  strike(a.owner, a.len%2===0 ? 'punch' : 'kick');
  var pop = document.createElement('div');
  pop.className = 'pop'; pop.textContent = '-'+dmg;
  pop.style.left = 'calc(var(--u)*' + (d.side==='left' ? 30 : 62) + ')';
  pop.style.top = 'calc(var(--u)*15)';
  game.appendChild(pop); setTimeout(function(){ pop.remove(); }, 900);
  renderHud();
  if(d.hp <= 0){ ko(a, d); return; }
  a.len = Math.min(MAXLEN, a.len + 1);
  a.pos = 0; a.combo = rndCombo(side, a.len);
  renderPanel(side);
}

function ko(winner, loser){
  state = 'ko'; var id = runId;
  wins[winner.owner]++;
  renderHud(); sfx.ko();
  showBanner('K.O.');
  setTimeout(function(){
    if(id!==runId) return;
    sub.textContent = 'RONDA PER A '+NAMES[winner.owner]; sub.classList.add('show');
  }, 1000);
  setTimeout(function(){
    if(id!==runId) return;
    setPose(loser.owner,'ko'); setPose(winner.owner,'win');
    els[loser.owner].classList.add('ko'); els[winner.owner].classList.add('win');
  }, 350);
  setTimeout(function(){
    if(id!==runId) return;
    hideBanner();
    afterRound();
  }, 2800);
}

function scoreLine(){
  return '<p style="margin-bottom:calc(var(--u)*1.5)"><b class="red">'+NAMES.p1+'</b> '+wins.p1+' - '+wins.p2+' <b class="blue">'+NAMES.p2+'</b></p>';
}
function afterRound(){
  if(round === 1){
    nextRound = 2; state = 'swap';
    setOverlay(
      '<h2>CANVI DE POSICIONS!</h2>'+scoreLine()+
      '<p><b class="red">'+NAMES.p1+'</b> passa a la <b>DRETA</b><br>'+
      '<b class="blue">'+NAMES.p2+'</b> passa a l\'<b>ESQUERRA</b></p>'+
      '<div class="blink">PREM ESPAI PER A LA RONDA 2</div>');
  } else if(round === 2 && wins.p1 === wins.p2){
    nextRound = 3; state = 'swap';
    setOverlay(
      '<h2>EMPAT!</h2>'+scoreLine()+
      '<p>Cada jugador ha guanyat una ronda.<br>Ronda de desempat <b>sense canviar de costat</b>.</p>'+
      '<div class="blink">PREM ESPAI PER AL DESEMPAT</div>');
  } else {
    endMatch();
  }
}

function endMatch(){
  state = 'end';
  var w = wins.p1 > wins.p2 ? 'p1' : 'p2';
  sfx.win();
  setOverlay(
    '<h2>VICTÒRIA PER A<br><span class="'+(w==='p1'?'red':'blue')+'">'+NAMES[w]+'</span></h2>'+
    '<p>Rondes guanyades<br><b class="red">'+NAMES.p1+': '+wins.p1+'</b> &nbsp;·&nbsp; <b class="blue">'+NAMES.p2+': '+wins.p2+'</b></p>'+
    '<div class="blink">PREM ESPAI PER REVENJA</div>'+
    '<p class="small">ESC: CANVIAR DE LLUITADOR</p>');
}

/* ================== TECLAT ================== */
addEventListener('keydown', function(e){
  if(e.repeat) return;
  initAudio();
  if(e.code === 'Escape'){
    if(state === 'names') menuScreen();
    else if(state === 'select') namesScreen();
    else if(state === 'stage' || state === 'end') selectScreen();
    return;
  }
  if(state === 'names'){ nameKey(e); return; }
  if(e.code === 'Space' || e.key === 'Enter'){
    e.preventDefault();
    if(state === 'menu') namesScreen();
    else if(state === 'select'){ if(sel.p1.ok && sel.p2.ok) stageScreen(); }
    else if(state === 'stage') chooseStage();
    else if(state === 'swap') startRound(nextRound);
    else if(state === 'end') startMatch();
    return;
  }
  var k = (e.key || '').toLowerCase();
  if(state === 'select'){ if(k.length===1){ e.preventDefault(); selectKey(k); } return; }
  if(state === 'stage'){ if(k.length===1){ e.preventDefault(); stageKey(k); } return; }
  if(state !== 'fight') return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(k.length !== 1) return;
  var side = LEFT.indexOf(k) >= 0 ? 'left' : (RIGHT.indexOf(k) >= 0 ? 'right' : null);
  if(!side) return;
  e.preventDefault();
  press(side, k);
});

applyStage();
applyChars();
placeFighters();
menuScreen(true);
loadSprites(function(){ applyChars(); placeFighters(); if(state==='select') drawSelect(); if(state==='menu') paintMenu(); });
loadStages(function(){ applyStage(); if(state==='stage') drawStage(); });
})();
</script>
