<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tour de France · Joc de mecanografia</title>
<style>
:root{--bg:#fff6d6;--ink:#1d2b53;--panel:#ffffff;--line:#d9cfa8;--accent:#f4c20d;--blue:#0055a4;--red:#ef4135;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10172e;--ink:#f2f4ff;--panel:#1b2547;--line:#34427a}}
:root[data-theme="dark"]{--bg:#10172e;--ink:#f2f4ff;--panel:#1b2547;--line:#34427a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap}
.title{font-weight:800;font-size:1.15rem;letter-spacing:.02em}
.title i{display:inline-block;width:42px;height:10px;margin-left:8px;border-radius:2px;background:linear-gradient(90deg,var(--blue) 33%,#fff 33% 66%,var(--red) 66%);border:1px solid var(--line)}
.stats{display:flex;gap:14px;font-size:1rem}
.stats b{font-variant-numeric:tabular-nums}
.route{position:relative;height:34px;margin:0 22px 4px}
.route .line{position:absolute;left:0;right:0;top:16px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--blue),#fff,var(--red));border:1px solid var(--line)}
.route span{position:absolute;top:2px;transform:translateX(-50%);font-size:22px;line-height:28px}
#me{z-index:2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
canvas{flex:1;width:100%;min-height:0;display:block}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,40,.55);padding:16px;z-index:5}
.overlay.hide{display:none}
.card{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:26px 28px;max-width:460px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.card h1{margin:0 0 6px;font-size:2rem}
.card p{margin:8px 0;line-height:1.45}
.card .big{font-size:3rem;margin:0}
.card table{margin:10px auto;border-collapse:collapse;font-size:1.05rem}
.card td{padding:3px 12px;text-align:left}
.card td:last-child{font-weight:700;text-align:right}
button{font:inherit;font-weight:700;font-size:1.1rem;margin-top:12px;padding:12px 28px;border:0;border-radius:999px;background:var(--accent);color:#1d2b53;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px);box-shadow:none}
#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
#me img{height:30px;display:block;image-rendering:pixelated}
.overlay{overflow:auto;align-items:flex-start}.card{margin:auto;max-width:600px}
#chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 4px}
#chars button{margin:0;padding:6px 4px;font-size:.78rem;font-weight:600;background:var(--bg);color:var(--ink);border:3px solid transparent;border-radius:12px;box-shadow:none}
#chars button.sel{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 2px var(--accent)}
#chars img{width:100%;height:60px;object-fit:contain;image-rendering:pixelated;display:block;margin-bottom:2px}
button.alt{background:transparent;color:var(--ink);box-shadow:none;border:2px solid var(--line);margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="title"><span style="display:inline-block;transform:scaleX(-1)">🚴</span> Tour de France<i></i></div>
    <div class="stats">
      <span>⭐ <b id="sc">0</b></span>
      <span>🎯 <b id="ac">100</b>%</span>
      <span>⌨️ <b id="wp">0</b> ppm</span>
      <span>⏱ <b id="tm">0:00</b></span>
    </div>
  </header>
  <div class="route"><div class="line"></div><span id="me"></span></div>
  <canvas id="cv"></canvas>

  <div class="overlay" id="start">
    <div class="card">
      <p class="big">🥖🥐🗼</p>
      <h1>Tour de France</h1>
      <p>Pedala per França! Escriu el nom de cada element abans d’arribar-hi i la bicicleta no s’aturarà.</p>
      <p><small>No cal escriure accents, guions ni espais.</small></p>
      <p><b>Tria el teu ciclista</b></p>
      <div id="chars"></div>
      <button id="go">Sortida! 🚴</button>
    </div>
  </div>
  <div class="overlay hide" id="end">
    <div class="card">
      <p class="big" id="stars">⭐⭐⭐</p>
      <h1>Arribada a París! 🏁</h1>
      <table>
        <tr><td>Temps</td><td id="r-tm"></td></tr>
        <tr><td>Velocitat</td><td id="r-wp"></td></tr>
        <tr><td>Precisió</td><td id="r-ac"></td></tr>
        <tr><td>Punts</td><td id="r-sc"></td></tr>
      </table>
      <button id="again">Torna a pedalar</button><button id="change" class="alt">Canvia de ciclista</button>
    </div>
  </div>
  <input id="kb" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Escriu aquí">
</div>

};
const CYCLISTS = [
  {name:"Maillot groc",img:SPR.c0},{name:"Rosa",img:SPR.c1},{name:"França",img:SPR.c2},{name:"Esquelet",img:SPR.c3},
  {name:"Astérix",img:SPR.c4},{name:"Turquesa",img:SPR.c5},{name:"Maillot de pois",img:SPR.c6},{name:"Urbà",img:SPR.c7}
];
const ITEMS = [
  {w:"baguette",img:SPR.baguette},{w:"croissant",img:SPR.croissant},{w:"fromage",img:SPR.fromage},{w:"vin",img:SPR.vin},
  {w:"champagne",img:SPR.champagne},{w:"escargots",img:SPR.escargots},{w:"café",img:SPR.cafe},{w:"mime",img:SPR.mime},
  {w:"peintre",img:SPR.peintre},{w:"bouledogue",img:SPR.bouledogue},{w:"accordéon",img:SPR.accordeo},{w:"métro",img:SPR.metro},
  {w:"lampadaire",img:SPR.lampadaire},{w:"Astérix",img:SPR.asterix},{w:"Obélix",img:SPR.obelix}
];
const LANDMARKS = [
  {w:"Torre Eiffel",img:SPR.eiffel,name:"la Torre Eiffel"},
  {w:"Arc de Triomf",img:SPR.arc,name:"l’Arc de Triomf"},
  {w:"Notre-Dame",img:SPR.notre,name:"Notre-Dame"}
];
const ITEMS_PER_STAGE = 4;

/* ============ UTILITATS ============ */
const $ = id => document.getElementById(id);
const norm = c => c.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const isLetter = c => /^[a-z]$/.test(norm(c));
const keyOf = w => [...w].map(norm).join("").replace(/[^a-z]/g,"");
const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const cv = $("cv"), ctx = cv.getContext("2d");
let W=0, H=0, S=1;
function resize(){
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio||1;
  cv.width = r.width*d; cv.height = r.height*d; W = r.width; H = r.height;
  S = Math.max(.6, Math.min(1.25, H/560));
  ctx.setTransform(d,0,0,d,0,0);
}
addEventListener("resize", resize);

/* ============ ESTAT ============ */
let state = "start";           // start | play | finishing | end
let track = [], idx = 0, dist = 0, speed = 0, finishX = 0;
let correct = 0, errors = 0, score = 0, elapsed = 0, shake = 0, endTimer = 0;
let fx = [], banner = {t:0,text:""};
const images = {};
function loadImg(s){ if(s && !images[s]){ const im=new Image(); im.src=s; images[s]=im; } }

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

function newGame(){
  const pool = shuffle(ITEMS.slice());
  track = []; let x = 700;
  LANDMARKS.forEach(L => {
    for(let i=0;i<ITEMS_PER_STAGE;i++){
      const it = pool.pop();
      track.push({...it, x, type:"item", pos:0, key:keyOf(it.w)});
      x += 430;
    }
    x += 150;
    track.push({...L, x, type:"land", pos:0, key:keyOf(L.w)});
    x += 640;
  });
  finishX = x; track.push({type:"finish", x});
  track.forEach(t => loadImg(t.img));
  idx = 0; dist = 0; speed = 0; correct = errors = score = elapsed = 0; fx = []; banner.t = 0;
  buildRoute(); hud();
}

function buildRoute(){
  document.querySelectorAll(".route .mk").forEach(n=>n.remove());
  track.filter(t=>t.type==="land"||t.type==="finish").forEach(t=>{
    const s=document.createElement("span"); s.className="mk";
    s.textContent = t.type==="finish" ? "🏁" : t.e;
    s.style.left = (t.x/finishX*100)+"%"; $("me").before(s);
  });
}

/* ============ ENTRADA DE TECLAT ============ */
const kb = $("kb");
function focusKb(){ kb.focus({preventScroll:true}); }
kb.addEventListener("input", () => { for(const ch of kb.value) typeChar(ch); kb.value = ""; });
cv.addEventListener("pointerdown", focusKb);
addEventListener("keydown", e => {
  if(e.key==="Enter"){
    if(state==="start") startGame(); else if(state==="end") startGame();
  }
});

function typeChar(ch){
  if(state!=="play") return;
  const t = track[idx];
  if(!t || t.type==="finish") return;
  if(cycX()+(t.x-dist) > W-30) return;       // encara no és a la pantalla
  if(!isLetter(ch)) return;                   // ignora espais, guions…
  if(norm(ch) === t.key[t.pos]){
    t.pos++; correct++; score += 10;
    if(t.pos === t.key.length) collect(t);
  } else { errors++; shake = .3; }
}

function collect(t){
  const sx = cycX()+(t.x-dist), land = t.type==="land";
  const bonus = land ? 150 : 50; score += bonus;
  fx.push({t, x0:sx, y0:groundY()-(land?90:45)*S, age:0, bonus});
  t.done = true; idx++;
  if(land){ banner = {t:2.6, text:"Has arribat a "+t.name+"! +"+bonus}; }
}

/* ============ GEOMETRIA ============ */
const cycX = () => W*0.2;
const groundY = () => H*0.72;   // línia on “planten” els elements
const roadY = () => H*0.84;     // on circula el ciclista

/* ============ JOC ============ */
function startGame(){
  newGame(); state = "play";
  $("start").classList.add("hide"); $("end").classList.add("hide"); focusKb();
}
$("go").onclick = startGame; $("again").onclick = startGame;

function update(dt){
  const MAX = 270 * (state==="start" ? .45 : 1);
  let cap = MAX;
  if(state==="play"){
    elapsed += dt;
    const t = track[idx];
    if(t.type==="item" || t.type==="land"){
      const gap = t.x - dist;
      cap = Math.max(0, Math.min(MAX, (gap-170)*3));
    } else if(dist >= t.x-90){ state="finishing"; endTimer=1.6; }
  }
  if(state==="finishing"){ cap = 0; endTimer -= dt; if(endTimer<=0) endGame(); }
  speed += (cap-speed) * Math.min(1, dt*4);
  if(speed<.5 && cap===0) speed = 0;
  dist += speed*dt;
  shake = Math.max(0, shake-dt);
  banner.t = Math.max(0, banner.t-dt);
  fx.forEach(f => f.age += dt); fx = fx.filter(f => f.age < .8);
}

function endGame(){
  state = "end";
  const m = elapsed/60, wpm = m>0 ? Math.round(correct/5/m) : 0, acc = accuracy();
  $("r-tm").textContent = fmt(elapsed); $("r-wp").textContent = wpm+" ppm";
  $("r-ac").textContent = acc+" %"; $("r-sc").textContent = score;
  $("stars").textContent = acc>=95 ? "⭐⭐⭐" : acc>=85 ? "⭐⭐" : "⭐";
  $("end").classList.remove("hide");
}
const accuracy = () => correct+errors ? Math.round(correct/(correct+errors)*100) : 100;
const fmt = s => (s/60|0)+":"+String(s%60|0).padStart(2,"0");

function hud(){
  $("sc").textContent = score; $("ac").textContent = accuracy();
  const m = elapsed/60; $("wp").textContent = m>.02 ? Math.round(correct/5/m) : 0;
  $("tm").textContent = fmt(elapsed);
  $("me").style.left = Math.min(100, dist/finishX*100)+"%";
}

/* ============ DIBUIX ============ */
function emoji(e, x, y, size, alpha=1){
  ctx.globalAlpha = alpha; ctx.font = size+"px "+FONT;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillText(e, x, y); ctx.globalAlpha = 1;
}
function sprite(t, x, y, size, alpha=1){
  const im = t.img && images[t.img];
  if(im && im.complete && im.naturalWidth){
    const k = Math.min(size/im.naturalWidth, size/im.naturalHeight), w = im.naturalWidth*k, hh = im.naturalHeight*k;
    ctx.globalAlpha = alpha; ctx.drawImage(im, x-w/2, y-hh, w, hh); ctx.globalAlpha = 1; return hh;
  }
  return size;
}
function hills(par, base, amp, f, color){
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W+10;x+=10) ctx.lineTo(x, base + Math.sin((x+dist*par)*f)*amp + Math.sin((x+dist*par)*f*2.3)*amp*.4);
  ctx.lineTo(W,H); ctx.fill();
}
function label(t, sx, y, isTarget){
  ctx.font = "bold "+Math.round(22*S)+"px ui-monospace,Menlo,Consolas,monospace";
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  let i=0, c=0;
  if(isTarget){
    while(i<t.w.length && c<t.pos){ if(isLetter(t.w[i])) c++; i++; }
    while(c>0 && i<t.w.length && !isLetter(t.w[i])) i++;
  }
  const done = t.w.slice(0,i), rest = t.w.slice(i);
  const wd = ctx.measureText(done).width, wr = ctx.measureText(rest).width, pad = 12*S, h = 34*S;
  const ox = isTarget && shake>0 ? Math.sin(shake*90)*6 : 0;
  const x = sx - (wd+wr)/2 + ox;
  ctx.fillStyle = isTarget ? "rgba(255,255,255,.97)" : "rgba(255,255,255,.7)";
  ctx.strokeStyle = isTarget ? (shake>0 ? "#d62828" : "#f4c20d") : "rgba(0,0,0,.2)";
  ctx.lineWidth = isTarget ? 3 : 1;
  ctx.beginPath(); ctx.roundRect(x-pad, y-h/2, wd+wr+pad*2, h, 10*S); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#1b9e4b"; ctx.fillText(done, x, y);
  ctx.fillStyle = "#1d2b53"; ctx.fillText(rest, x+wd, y);
}

function draw(){
  ctx.imageSmoothingEnabled = false;
  const gy = groundY(), ry = roadY(), cx = cycX();
  // cel
  const sky = ctx.createLinearGradient(0,0,0,gy);
  sky.addColorStop(0,"#6ec1ff"); sky.addColorStop(1,"#d8f0ff");
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);
  emoji("☀️", W*.85, H*.2, 60*S);
  for(let k=0;k<5;k++){
    const x = ((k*W/4 - dist*.05) % (W+200) + (W+200)) % (W+200) - 100;
    emoji("☁️", x, H*(.12+(k%3)*.08), 56*S, .9);
  }
  hills(.15, gy-H*.17, 18*S, .004, "#9ccf9a");
  hills(.35, gy-H*.07, 14*S, .006, "#6fb56e");
  // herba i carretera
  ctx.fillStyle = "#58a75a"; ctx.fillRect(0, gy-4, W, H-gy+4);
  ctx.fillStyle = "#6b6f7a"; ctx.fillRect(0, gy+H*.04, W, H*.2);
  ctx.fillStyle = "#fff"; 
  for(let x=-((dist)%90)-90; x<W; x+=90) ctx.fillRect(x, ry+H*.015, 44, 4);
  // arbres de decorat
  for(let k=Math.floor((dist-cx)/260)-1; k<Math.ceil((dist+W)/260); k++){
    const wx = k*260 + ((k*73)%90), sx = cx+(wx-dist);
    emoji(k%7===0?"🏡":(k%2?"🌳":"🌲"), sx, gy+H*.03, (k%7===0?64:54)*S);
  }
  // elements
  track.forEach((t,i) => {
    if(t.done) return;
    const sx = cx+(t.x-dist); if(sx<-250||sx>W+250) return;
    if(t.type==="finish"){ emoji("🏁", sx, gy+H*.03, 120*S); return; }
    const size = (t.type==="land" ? 190 : 92)*S;
    const hh = sprite(t, sx, gy+H*.03, size);
    label(t, sx, gy+H*.03-hh-20*S, i===idx);
  });
  // efectes de recollida
  fx.forEach(f => {
    const p = f.age/.8, x = f.x0+(cx-f.x0)*p, y = f.y0+(roadY()-90*S-f.y0)*p - Math.sin(p*Math.PI)*40;
    sprite(f.t, x, y, (f.t.type==="land"?190:92)*S*(1-p*.6), 1-p);
    ctx.font = "bold "+(22*S)+"px system-ui,sans-serif"; ctx.fillStyle = "#b8860b"; ctx.textAlign="center";
    ctx.fillText("+"+f.bonus, f.x0, f.y0-60*S-p*40);
  });
  // ciclista
  const bob = speed>10 ? Math.sin(dist*.06)*3*S : 0;
  sprite(rider, cx, ry+34*S+bob, 160*S);
  // missatge d’arribada
  if(banner.t>0){
    ctx.globalAlpha = Math.min(1, banner.t*2);
    ctx.font = "bold "+Math.round(28*S)+"px system-ui,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    const w = ctx.measureText(banner.text).width+50;
    ctx.fillStyle = "#f4c20d"; ctx.beginPath(); ctx.roundRect(W/2-w/2, H*.08, w, 56*S, 16); ctx.fill();
    ctx.fillStyle = "#1d2b53"; ctx.fillText(banner.text, W/2, H*.08+28*S);
    ctx.globalAlpha = 1;
  }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  update(dt); draw(); hud();
  requestAnimationFrame(loop);
}
let rider = CYCLISTS[0];
function pick(i){
  rider = CYCLISTS[i];
  [...$("chars").children].forEach((b,j) => b.classList.toggle("sel", j===i));
  $("me").innerHTML = '<img alt="" src="'+rider.img+'">';
}
CYCLISTS.forEach((c,i) => {
  loadImg(c.img);
  const b = document.createElement("button");
  b.innerHTML = '<img alt="" src="'+c.img+'"><span>'+c.name+'</span>';
  b.onclick = () => pick(i); $("chars").append(b);
});
$("change").onclick = () => { $("end").classList.add("hide"); $("start").classList.remove("hide"); state = "start"; newGame(); };
resize(); newGame(); pick(0); state = "start";
requestAnimationFrame(loop);
</script>
