 else if(ph==='block'){ball.x+=vel.x*dt;ball.z+=vel.z*dt;ball.h=Math.max(0,ball.h-30*dt);if(pt>.9){if(fails>=3)over('Has gastat les 3 targetes');else newPass()}}
